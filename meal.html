<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>잡곡 사용량 계산</title>
    <style>
body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            cursor: pointer;
        }
        form {
            max-width: 100%;
            margin: 0 auto;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
        .form-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 10px;
        }
        .form-group label {
            flex: 0 0 45%;
            margin: 0;
        }
        .form-group input,
        .form-group select {
            flex: 1 1 55%;
            padding: 8px;
            margin: 0;
            box-sizing: border-box;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        #grain-checkboxes {
            display: flex;
            flex-wrap: wrap;
        }
        #grain-checkboxes label {
            flex: 1 1 45%;
            margin-right: 20px;
            box-sizing: border-box;
        }
        @media (max-width: 600px) {
            #grain-checkboxes label {
                flex: 1 1 100%;
                margin-right: 0;
            }
            .form-group label,
            .form-group input,
            .form-group select {
                flex: 1 1 100%;
            }
            .title {
                font-size: 50pt; /* 원하는 크기로 조정 */
                text-align: center;
                font-weight: bold;
                color: #0057A1; /* 정부청색 */
                font-family: 'HakgyoansimKkokkomaR', sans-serif;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2); /* 그림자 설정 */
                cursor: pointer;
                margin-left: 10px; /* 이미지와 타이틀 간격 */
                margin-top: 20px; /* 메뉴를 위로 이동 */
                margin-bottom: 40px; /* 타이틀과 폼 간격 추가 */
            }
        }

        /* 타이틀 이미지 스타일링 */
        .title img {
            width: 150px; /* Set initial width to a smaller size */
            height: auto;
            margin-right: 10px;
        }

        /* Modal styling */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9); /* Dark background */
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 100%;
            max-width: 1800px;
            justify-content: center;
            text-align: center; /* Center align contents */
        }

        /* Modal image styling */
        .modal-content img {
            width: 70%; /* Adjust width as needed */
            height: auto; /* Maintain aspect ratio */
            margin: auto; /* Center align image */
            display: block; /* Ensure image is block element */
        }

        /* Close button styling */
        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>잡곡 사용량 계산</h1>
<div class="title-container">
    <h1 class="title" onclick="window.location.reset();">
        <img src="/pages/ssal.png" alt="" onclick="openModal('/pages/ssal.png')">
    </h1>
</div>    

<!-- 모달 요소 -->
<div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <div class="modal-content">
        <img id="modal-image" src="">
    </div>
</div>

<form id="grain-consumption-form">
    <h2>가구의 한달 식사수</h2>
    <div class="form-group">
        <label for="days">한달의 일수:</label>
        <select id="days" name="days" required>
            <option value="28">28일</option>
            <option value="29">29일</option>
            <option value="30">30일</option>
            <option value="31">31일</option>
        </select>
    </div>
    <div class="form-group">
        <label for="entertainment_times">가구의 한달 접대 횟수(잡곡 사용량 계산 위해 대체식품은 접대에서 제외):</label>
        <input type="number" id="entertainment_times" name="entertainment_times" placeholder="가구의 한달 동안의 접대 횟수를 입력하세요" required>
    </div>
    <div class="form-group">
        <label for="entertainer_meals">가구의 접대인의 한끼 식사량(kg):</label>
        <input type="number" id="entertainer_meals" name="entertainer_meals" step="0.01" placeholder="접대인의 한끼 식사량을 입력하세요" required>
    </div>
    <div class="form-group">
        <label for="household_size">가구 인원수:</label>
        <input type="number" id="household_size" name="household_size" min="1" max="8" placeholder="가구 인원수를 입력하세요" required>
    </div>

    <div id="household-members"></div>

    <!-- 양곡 종류 및 비율 입력란 -->
    <h2>사용 잡곡</h2>
    <div id="grain-checkboxes"></div>

    <h2>잡곡 사용 비율 입력</h2>
    <div id="grain-ratio-inputs"></div>

    <input type="submit" value="계산하기">
</form>

<div id="result-div"></div>

<script>
    document.getElementById("household_size").addEventListener("change", function() {
        let householdSize = parseInt(this.value);
        let householdMembersDiv = document.getElementById("household-members");

        householdMembersDiv.innerHTML = ""; // 기존에 생성된 입력란 삭제

        for (let i = 1; i <= householdSize; i++) {
            householdMembersDiv.innerHTML += `
                <div class="form-group">
                    <label for="member-meals-${i}">가구원 ${i}의 1끼 식사량(kg):</label>
                    <input type="number" id="member-meals-${i}" name="member-meals-${i}" placeholder="가구원 ${i}의 1끼 식사량을 입력하세요" required step="0.01">
                </div>
                <div class="form-group">
                    <label for="member-eating-out-${i}">가구원 ${i}의 한달 외식수:</label>
                    <input type="number" id="member-eating-out-${i}" name="member-eating-out-${i}" placeholder="가구원 ${i}의 한달 동안 외식한 횟수를 입력하세요" required>
                </div>
                <div class="form-group">
                    <label for="member-skipped-meals-${i}">가구원 ${i}의 한달 결식수(잡곡 사용량 계산 위해 대체식품은 결식에 포함):</label>
                    <input type="number" id="member-skipped-meals-${i}" name="member-skipped-meals-${i}" placeholder="가구원 ${i}의 한달 동안 결식한 횟수를 입력하세요" required>
                </div>
            `;
        }
    });

    document.getElementById("grain-checkboxes").addEventListener("change", function() {
        let checkedGrains = document.querySelectorAll("input[name='grain-checkbox']:checked");
        let grainRatioInputs = document.getElementById("grain-ratio-inputs");

        grainRatioInputs.innerHTML = ""; // 이전 내용 초기화

        // 선택된 양곡에 대해 비율 입력란 생성
        checkedGrains.forEach(function(grain) {
            let grainIndex = parseInt(grain.value);
            let grainLabel = grain.dataset.label;

            let formGroup = document.createElement("div");
            formGroup.className = "form-group";
            let label = document.createElement("label");
            label.textContent = grainLabel + " 사용비율(%):";
            let input = document.createElement("input");
            input.type = "number";
            input.id = "grain-ratio-" + grainIndex;
            input.name = "grain-ratio-" + grainIndex;
            input.placeholder = grainLabel + " 비율을 입력하세요";
            input.required = true;

            formGroup.appendChild(label);
            formGroup.appendChild(input);

            grainRatioInputs.appendChild(formGroup);
        });
    });

    document.getElementById("grain-consumption-form").addEventListener("submit", function(event) {
        event.preventDefault();

        let daysInMonth = parseInt(document.getElementById("days").value);
        let totalMealsPerMonth = daysInMonth * 3; // 한달의 총 끼니수 계산 (한 사람당 하루 3끼)

        // 초기화
        let totalGrainConsumption = 0;
        let totalEntertainmentFactor = 0;
        let totalEatingOutFactor = 0;
        let totalSkippedMealsFactor = 0;
        let householdSize = parseInt(document.getElementById("household_size").value);

        // 가구원 별로 입력된 값 계산
        for (let i = 1; i <= householdSize; i++) {
            let memberMeals = parseFloat(document.getElementById("member-meals-" + i).value);
            let memberEatingOut = parseInt(document.getElementById("member-eating-out-" + i).value);
            let memberSkippedMeals = parseInt(document.getElementById("member-skipped-meals-" + i).value);

            // 외식 횟수가 한달의 총 끼니수를 초과할 경우 알림 표시
            if (memberEatingOut > totalMealsPerMonth) {
                alert("가구원 " + i + "의 외식 횟수는 한 달의 총 끼니수를 초과할 수 없습니다.");
                return; // 계산 중단
            }

            // 가구 한달 총 끼니수 * 가구원 n의 1끼 식사량 합계(kg)
            totalGrainConsumption += (totalMealsPerMonth - memberEatingOut - memberSkippedMeals) * memberMeals;

            // 가구의 한달 외식수 * 가구원 n의 1끼 식사량(kg)
            totalEatingOutFactor += memberEatingOut;

            // 가구의 한달 결식수 * 가구원 n의 1끼 식사량(kg)
            totalSkippedMealsFactor += memberSkippedMeals;
        }

        // 가구의 한달 접대 횟수 * 가구의 접대인의 한끼 식사량(kg)
        totalEntertainmentFactor = parseInt(document.getElementById("entertainment_times").value);

        let entertainerMeals = parseFloat(document.getElementById("entertainer_meals").value);
        totalGrainConsumption += totalEntertainmentFactor * entertainerMeals;

        // 선택된 양곡 비율 입력 및 계산
        let checkedGrains = document.querySelectorAll("input[name='grain-checkbox']:checked");
        let grainUsage = {};
        let totalRatio = 0; // 비율의 합 초기화

        checkedGrains.forEach(function(grain) {
            let grainIndex = parseInt(grain.value);
            let grainRatio = parseFloat(document.getElementById("grain-ratio-" + grainIndex).value);
            let grainLabel = grain.dataset.label;
            grainUsage[grainLabel] = (totalGrainConsumption * grainRatio / 100).toFixed(2);
            totalRatio += grainRatio; // 비율을 합산
        });

        // 비율의 합이 100%가 아닌 경우 알림 표시
        if (totalRatio !== 100) {
            alert("잡곡 비율의 합이 100%가 아닙니다.");
            return; // 계산 중단
        }

        // 결과 표시
        let resultDiv = document.getElementById("result-div");
        resultDiv.innerHTML = "<h2>결과</h2>";
        resultDiv.innerHTML += "<p>가구 한달 잡곡 총 소비량: " + totalGrainConsumption.toFixed(2) + " kg</p>";
        resultDiv.innerHTML += "<p>각 잡곡의 사용량:</p>";
        for (let grain in grainUsage) {
            resultDiv.innerHTML += "<p>" + grain + ": " + grainUsage[grain] + " kg</p>";
        }
        resultDiv.innerHTML += "<p>가구 한달 총 외식 횟수: " + totalEatingOutFactor + " 회</p>";
        resultDiv.innerHTML += "<p>가구 한달 총 결식 횟수(대체식품 포함): " + totalSkippedMealsFactor + " 회</p>";
        resultDiv.innerHTML += "<p>가구 한달 접대 횟수(대체식품 제외): " + totalEntertainmentFactor + " 회</p>";
    });

    // 초기에 양곡 종류 체크박스 생성
    let grains = [
        "멥쌀", "찹쌀", "겉보리쌀", "쌀보리쌀", "맥주보리쌀", "기타맥류", "밀가루", "옥수수",
        "기타잡곡", "콩", "팥", "땅콩", "기타두류", "고구마", "감자"
    ];

    let grainCheckboxesDiv = document.getElementById("grain-checkboxes");
    grains.forEach(function(grain, index) {
        let label = document.createElement("label");
        let checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.name = "grain-checkbox";
        checkbox.value = index;
        checkbox.dataset.label = grain;
        label.appendChild(checkbox);
        label.appendChild(document.createTextNode(grain));
        grainCheckboxesDiv.appendChild(label);
    });

    document.querySelector("h1").addEventListener("click", function() {
        location.reload();
    });

    /* 모달 관련 스크립트 */
    function openModal(src) {
        document.getElementById('modal-image').src = src;
        document.getElementById('myModal').style.display = "block";
    }

    function closeModal() {
        document.getElementById('myModal').style.display = "none";
    }

</script>

</body>
</html>
