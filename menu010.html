
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>곡종 중량 단위 변환 & 원재료 중량</title>
</head>
<style>
        body {
            text-align: center;
            background-color: #f9f9f9;
            margin: 0 auto;
            font-family: Arial, sans-serif;
        }
        h1 {
            text-align: center;
            cursor: pointer;
	    font-size: 30px;
            padding: 20px 0;
            margin: 0;
            background-color: #2c3e50;
            color: white;
        }
        .iframe-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        iframe {
            width: 100%;
            height: 750px;
            border: none;
            margin-bottom: 0px;
        }
        @media (min-width: 601px) {
            .iframe-container {
                flex-direction: row;
                justify-content: space-around;
            }
            iframe {
                width: 48%;
                margin-bottom: 0;
            }
        }


        .title img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.9);
        }

        .modal-content {
            margin: auto;
            display: block;
            width: 100%;
            max-width: 1800px;
            justify-content: center;
            text-align: center;
        }

        .modal-content img {
            width: 70%;
            height: auto;
            margin: auto;
            display: block;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 35px;
            color: #f1f1f1;
            font-size: 40px;
            font-weight: bold;
        }

        .close:hover,
        .close:focus {
            color: #bbb;
            text-decoration: none;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .calculator-container {
                padding: 10px;
            }
	    .h1 {
		font-size: 14px;
	    }
		
            .calculator {
                margin-right: 0;
                margin-bottom: 20px;
            }
        }

</style>

<body>
    <h1 onclick="window.location.reload();">곡종 중량 단위 변환 & 원재료 중량</h1>
    <div class="iframe-container">
    <iframe src="/pages/unit" width="400" height="750" title="Example Site"></iframe>
    <iframe src="/pages/original" width="400" height="750" title="Example Site"></iframe>
    </div>


    <h1 class="title" onclick="resetCalculators()">
        <img src="/pages/hope.png" alt="" onclick="openModal('/pages/hope.png')">
    </h1>

	<div id="myModal" class="modal">
	    <span class="close" onclick="closeModal()">&times;</span>
	    <div class="modal-content">
	        <img id="modal-image" src="">
	    </div>
	</div>


<script>
            /*이미지 스크립트*/

        function openModal(src) {
            document.getElementById('modal-image').src = src;
            document.getElementById('myModal').style.display = "block";
        }

        function closeModal() {
            document.getElementById('myModal').style.display = "none";
        }
</script>
</body>
</html>
