<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포기당 이삭수 평균 최근접값 계산기</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.5rem;
            cursor: pointer;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            gap: 5px;
            width: 100%;
            max-width: 100%; /* 최대 너비를 100%로 설정하여 모바일 화면에 맞춤 */
            margin: auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        label {
            text-align: right;
            padding-right: 10px;
            line-height: 30px;
            font-weight: bold;
            color: #555;
            font-size: 0.9rem;
        }

        input[type="number"], select, input[type="text"] {
            width: 100%; /* 입력 필드 너비를 100%로 설정하여 부모 요소에 맞춤 */
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
            box-sizing: border-box;
        }

        input[type="number"]:focus, select:focus, input[type="text"]:focus {
            border-color: #007BFF;
            outline: none;
            box-shadow: 0 0 5px rgba(0, 123, 255, 0.5);
        }

        .highlight-input {
            border: 3px solid red;
            box-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        .highlight-label {
            background-color: yellow;
        }

        .difference {
            font-size: 0.8rem;
            color: #777;
            text-align: center;
            line-height: 30px;
        }

        .result {
            text-align: center;
            margin-top: 20px;
            font-size: 1.2rem;
            color: #333;
            font-weight: bold;
            grid-column: 1 / -1;
        }

        .missing-numbers {
            text-align: center;
            margin-top: 10px;
            font-size: 1rem;
            color: red;
            grid-column: 1 / -1;
        }

        .memo {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1rem;
            color: #555;
            grid-column: 1 / -1;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr; /* 모바일 화면에서 폼을 단일 열로 변경 */
            }

            label {
                text-align: left;
                padding-right: 0;
                padding-bottom: 5px;
            }

            .difference {
                text-align: right;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h2 {
                font-size: 1.2rem;
            }

            input[type="number"], select, input[type="text"] {
                font-size: 14px;
                padding: 8px;
            }

            .result {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

<div>
    <h2 onclick="window.location.reload();">논벼 예상생산량조사를 위한 계산기</h2>  

    <div class="memo">
        <label for="memo">메모</label>
        <input type="text" id="memo" name="memo" placeholder="활용팁! 메모(지번 등), 주수 입력 후 캡처">
    </div>

    <div class="memo">
        <label for="cropCondition">작황</label>
        <select id="cropCondition" name="cropCondition">
            <option value="" selected disabled>해당 필지의 작황을 선택하세요</option>
            <option value="상상">상상</option>
            <option value="상중">상중</option>
            <option value="상하">상하</option>
            <option value="중상">중상</option>
            <option value="중중">중중</option>
            <option value="중하">중하</option>
            <option value="하상">하상</option>
            <option value="하중">하중</option>
            <option value="하하">하하</option>
        </select>
    </div>

    <form id="numberForm">
        <label id="label1" for="num1">1번주</label>
        <input type="number" id="num1" name="num1" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 2)" required>
        <div class="difference" id="diff1"></div>

        <label id="label2" for="num2">2번주</label>
        <input type="number" id="num2" name="num2" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 3)" required>
        <div class="difference" id="diff2"></div>

        <label id="label3" for="num3">3번주</label>
        <input type="number" id="num3" name="num3" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 4)" required>
        <div class="difference" id="diff3"></div>

        <label id="label4" for="num4">4번주</label>
        <input type="number" id="num4" name="num4" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 5)" required>
        <div class="difference" id="diff4"></div>

        <label id="label5" for="num5">5번주</label>
        <input type="number" id="num5" name="num5" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 6)" required>
        <div class="difference" id="diff5"></div>

        <label id="label6" for="num6">6번주</label>
        <input type="number" id="num6" name="num6" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 7)" required>
        <div class="difference" id="diff6"></div>

        <label id="label7" for="num7">7번주</label>
        <input type="number" id="num7" name="num7" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 8)" required>
        <div class="difference" id="diff7"></div>

        <label id="label8" for="num8">8번주</label>
        <input type="number" id="num8" name="num8" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 9)" required>
        <div class="difference" id="diff8"></div>

        <label id="label9" for="num9">9번주</label>
        <input type="number" id="num9" name="num9" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 10)" required>
        <div class="difference" id="diff9"></div>

        <label id="label10" for="num10">10번주</label>
        <input type="number" id="num10" name="num10" min="0" max="99" inputmode="numeric" pattern="[0-9]*" placeholder="숫자를 입력하세요" onkeydown="moveToNext(event, 1)" required>
        <div class="difference" id="diff10"></div>

        <div class="missing-numbers" id="missingNumbers"></div>
        <div class="result" id="result"></div>
    </form>
</div>

<script>
    function moveToNext(event, nextId) {
        if (event.key === "Enter" || event.key === "ArrowDown") {
            document.getElementById('num' + nextId).focus();
        } else if (event.key === "ArrowUp") {
            document.getElementById('num' + (nextId - 2)).focus();
        }
    }

    function checkAllFilled() {
        let allFilled = true;
        let missing = [];

        for (let i = 1; i <= 10; i++) {
            let value = document.getElementById('num' + i).value;
            if (value === "") {
                missing.push(i + "번주");
                allFilled = false;
            } else if (parseFloat(value) > 100) {
                alert("100 미만의 값을 입력해야 합니다.");
                document.getElementById('num' + i).value = ''; 
                missing.push(i + "번주");
                allFilled = false;
            }

            document.getElementById('num' + i).classList.remove('highlight-input');
            document.getElementById('label' + i).classList.remove('highlight-label');
        }

        if (missing.length > 0) {
            document.getElementById('missingNumbers').textContent = "미입력 번호: " + missing.join(', ');
            document.getElementById('result').innerHTML = "";
            clearDifferences();
        } else {
            document.getElementById('missingNumbers').textContent = "";
            findClosest();
        }
    }

    function findClosest() {
        let numbers = [];
        for (let i = 1; i <= 10; i++) {
            let value = parseFloat(document.getElementById('num' + i).value);
            numbers.push(value);
        }

        let sum = numbers.reduce((acc, cur) => acc + cur, 0);
        let average = sum / numbers.length;

        let minDiff = Number.MAX_VALUE;
        let closestIndex = -1;

        for (let i = 0; i < numbers.length; i++) {
            let diff = Math.abs(numbers[i] - average);
            document.getElementById('diff' + (i + 1)).textContent = `편차: ${diff.toFixed(2)}`;
            if (diff < minDiff || (diff === minDiff && closestIndex > i)) {
                minDiff = diff;
                closestIndex = i;
            }
        }

        document.getElementById('num' + (closestIndex + 1)).classList.add('highlight-input');
        document.getElementById('label' + (closestIndex + 1)).classList.add('highlight-label');

        document.getElementById('result').innerHTML = `평균 이삭수: ${average.toFixed(2)}<br>${closestIndex + 1}번주를 가져오세요`;
    }

    function clearDifferences() {
        for (let i = 1; i <= 10; i++) {
            document.getElementById('diff' + i).textContent = '';
        }
    }

    document.getElementById('numberForm').addEventListener('input', checkAllFilled);
</script>

</body>
</html>
