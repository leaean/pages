const selectedSubCategories = []; // 서브 카테고리 예시 (비어있음)
const selectedCard = 'all';  // 카드 선택 예시 (전체 선택)

// 검색 기능 수정
document.getElementById("searchForm").addEventListener("submit", function(event) {
    event.preventDefault();
    const searchTerm = document.getElementById("searchTerm").value.toLowerCase();

    let hasResult = false;

    const tablesDiv = document.getElementById("tables");
    tablesDiv.innerHTML = '';  // 검색 결과를 초기화합니다.

    selectedFilters.forEach(category => {
        if (data.hasOwnProperty(category)) {
            const matchedData = data[category].filter(item => {
                return (
                    (selectedSubCategories.length === 0 || selectedSubCategories.includes('all') || selectedSubCategories.includes(item[0])) &&
                    (selectedCard === 'all' || item[1] === selectedCard) &&
                    (searchTerm === '' || item.join().toLowerCase().includes(searchTerm))
                );
            });

            if (matchedData.length > 0) {
                hasResult = true;

                const h2 = document.createElement('h2');
                h2.textContent = category;
                tablesDiv.appendChild(h2);

                const table = document.createElement('table');
                table.innerHTML = `<thead>
                    <tr>
                        <th>번호</th>
                        <th>구분</th>
                        <th>작물명</th>
                        <th>부호</th>
                        <th>세부구분</th>
                    </tr>
                </thead>
                <tbody id="resultBody_${category}"></tbody>`;

                tablesDiv.appendChild(table);

                const resultBody = document.getElementById(`resultBody_${category}`);

                matchedData.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item[1] || ''}</td>
                        <td>${item[2] || ''}</td>
                        <td>${item[3] || ''}</td>
                        <td>${item[4] || ''}</td>
                    `;
                    resultBody.appendChild(row);
                });
            }
        }
    });

    if (!hasResult) {
        alert('검색 결과가 없습니다.');
    }
});

// 초기화 버튼 클릭 시 필터 및 검색어 초기화
document.querySelector('h1').addEventListener('click', function() {
    document.getElementById("searchTerm").value = '';
    document.getElementById("tables").innerHTML = '';
});
