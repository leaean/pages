<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>농업 계산기</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .section {
            margin-bottom: 20px;
        }
        .result {
            font-weight: bold;
            color: red;
        }
        input {
            margin: 5px 0;
            padding: 8px;
            width: 100%;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="section">
            <h2>1m²당 포기수 계산기</h2>
            <label for="width">가로 1포기간 길이(cm):</label>
            <input type="number" id="width" step="0.01" min="0" placeholder="예: 30">
            
            <label for="height">세로 1포기간 길이(cm):</label>
            <input type="number" id="height" step="0.01" min="0" placeholder="예: 15">
            
            <button onclick="calculatePlantDensity()">계산하기</button>
            <p>1m²당 포기수는 <span id="density-result" class="result">--</span>입니다.</p>
        </div>

        <div class="section">
            <h2>10a당 예상생산량 계산기 (백미기준)</h2>
            <label for="avgPlants">1m²당 평균 포기수(A포구·B포구):</label>
            <input type="number" id="avgPlants" step="0.01" min="0" placeholder="예: 20">
            
            <label for="earPerPlant">포기당 평균 이삭수:</label>
            <input type="number" id="earPerPlant" step="0.01" min="0" placeholder="예: 20">
            
            <label for="grainPerEar">이삭당 완전 낟알 수:</label>
            <input type="number" id="grainPerEar" step="0.01" min="0" placeholder="예: 60">
            
            <label for="thousandGrainWeight">천립중(g):</label>
            <input type="number" id="thousandGrainWeight" step="0.01" min="0" placeholder="예: 25">
            
            <button onclick="calculateYield()">계산하기</button>
            <p>해당 필지의 10a당 예상생산량 (백미기준)은 <span id="yield-result" class="result">--</span>입니다.</p>
        </div>
    </div>

    <script>
        function calculatePlantDensity() {
            const width = parseFloat(document.getElementById('width').value);
            const height = parseFloat(document.getElementById('height').value);

            if (width > 0 && height > 0) {
                const density = 10000 / (width * height);
                document.getElementById('density-result').innerText = density.toFixed(2);
            } else {
                document.getElementById('density-result').innerText = '입력을 확인하세요';
            }
        }

        function calculateYield() {
            const avgPlants = parseFloat(document.getElementById('avgPlants').value);
            const earPerPlant = parseFloat(document.getElementById('earPerPlant').value);
            const grainPerEar = parseFloat(document.getElementById('grainPerEar').value);
            const thousandGrainWeight = parseFloat(document.getElementById('thousandGrainWeight').value);

            if (avgPlants > 0 && earPerPlant > 0 && grainPerEar > 0 && thousandGrainWeight > 0) {
                const yieldAmount = (avgPlants * earPerPlant * grainPerEar * thousandGrainWeight) / 1000;
                document.getElementById('yield-result').innerText = yieldAmount.toFixed(2)+"kg";
            } else {
                document.getElementById('yield-result').innerText = '입력을 확인하세요';
            }
        }
    </script>
</body>
</html>
