 	    ['농업', '농가경제조사', '조사용어', '수익성지표', '(1) 농업총수입<br>-농업수입(현금,현물)+생산현물가계소비+미처분농축산물증감액+대동식물증감액<br>(2)농업유동재비<br>-농업경영비-(지불노임+지불임차료+지불이자+감가상각비)<br>(3)농업부가가치<br>-일반적으로 각종 농업생산성 지표는 산출액/투입액으로 정의되는데 종전까지 산출액으로 사용해 오던 농업소득 대신에1992년부터는 국제적으로 통용되는 농업부가가치 개념을 사용한다.<br>-농업총수입-(중간재비-감가상각비)<br>ㆍ중간재비=농업경영비-(지불노임+지불임차료+지불이자)<br>(4)농업자본액<br>-농가 경영규모의 척도로서 농업생산에 투입된 자본재 중 재생산 가능한 자본재를 평가한 금액(①+②+③+④)이다.<br>①토지자산(자작지,대부지)의 토지개량,개간ㆍ간척,경지정리,지목변경에 따른 연중증가액 중 투입자본액(구입지불비,자급 재료비,가족노동평가액)<br>②건물 및 구축물과 기계ㆍ기구ㆍ비품,대식물,대동물 등 토지를 제외한 농업용 고정자산의 연말 평가액<br>③미처분농축산물,미사용구입자재,소동물 등 농업용 유동자산에 대한 연말 평가액<br>④1년간 투입된 경상적 농업경영비(감가상각비,미사용구입자재증감 제외)<br>(5)농업노동1시간당 농업소득<br>-농업소득/자영농업노동시간<br>(6)농업노동1시간당 농업총수입<br>-농업총수입/자영농업노동시간<br>(7)단위자본(백만원)당 농업소득<br>- (농업소득/농업고정자본액)x단위자본<br>(8)단위자본(백만원)당 농업총수입<br>- (농업총수입/농업고정자본액)x단위자본<br>(9)단위면적(10a)당 농업소득<br>- (농업소득/경영경지면적)x단위면적<br>(10)단위면적(10a)당 농업총수입<br>- (농업총수입/경영경지면적)x단위면적<br>(11)농업소득률<br>- {(농업총수입-농업경영비)/농업총수입x100'],
 	    ['농업', '농가경제조사', '조사용어', '생산성지표', '(1) 노동생산성<br>-투하된 노동력과 그 결과로써 얻은 생산량의 비율이다.<br>-농업부가가치/자영농업노동시간<br>*노동생산성 지표는 자본생산성 지표와 함께 농업과 타 산업 또는 농가 상호간의 경제적 능률을 비교하는 주요 지표이다.<br>(2)토지생산성<br>-토지면적 단위당의 생산량을 말하며 그 토지의 경제성을 타 토지와 비교하는데 사용한다.<br>-농업부가가치/경지면적(10a)<br>(3)자본생산성<br>-투입된 자본에 대한 생산량을 말하며,자본생산성/백만원하면 자본계수와는 역수의 관계에 있다.<br>-농업부가가치/농업자본액(백만원)<br>(4)노동집약도<br>-일반적으로 단위생산물에 대한 투하노동량의 비율을 뜻하며 농가 경제조사에서는 일정 경지면적에 대해 투하된 노동량을 말한다.<br>-자영농업노동시간/경지면적(10a)<br>(5)자본집약도<br>-일정 경지면적에 대하여 투입된 농업자본액을 말한다.<br>-경영규모의 내연적 확대를 표시하는 집약도 지표로서는 자본집약도와 노동집약도로 나누어 고찰할 수 있다.<br>-농업자본액/경지면적(10a)<br>(6)자본구성도(자본장비율)<br>-일반적으로 노동자1인당 자본액을 말하는데 농업의 경우 가족노동이 많고 노동의 계절성 때문에 제조업의 경우와 같이 노동자1인당 자본장비율을 표시하지 않는다.<br>-농업자본액/자영농업노동시간,노동생산성x자본계수<br>(7)자본계수<br>-일정 기간의 생산량에 대한 자본량의 비율이다.<br>-생산량을O,자본량을K로 하여 보통K/O로 표시한다.<br>-이 자본계수가 높으면 그만큼 자본의 생산 효과가 낮아진다.<br>-또한,새로 추가되는 생산량1단위와 이를 생산하기 위해 필요로 하는 자본의 추가량의 비율을 한계자본계수라고 하며△K/△O로 표시한다.<br>-자본집약도/토지생산성'],
 	    ['농업', '농가경제조사', '조사용어', '안전성지표', '(1) 유동비율<br>-단기채무에 충당할 수 있는 유동성자산이 얼마나 되는가를 나타내는 비율로서 기업의 단기지급능력을 판단하는 대표적인 지표로서 일반적으로 표준비율은200%이상으로 보고 있다.<br>-유동자산/유동부채x100<br>(2)부채비율<br>-회사의 부채총액을 자기자본액으로 나눈 백분율로,기업자본 구성의 안전도,특히 타인자본의존도를 표시하는 지표이다.<br>-일반적으로100%이하를 표준비율로 보고 있으나 이와 같은 입장은 여신자 측에서 채권회수의 안전성만을 고려한 것이며 기업경영의 측면에서는 단기적 채무변제의 압박을 받지 않는 한 투자수익률이 이자율을 상회하면 타인자본을 계속 이용하는 것이 유리하다.<br>-따라서 이 비율을 여신자 측에서 채권회수에 대한 위험부담의 측정기준으로 또는 기업경영자 측에서 타인자본의 합리적인 조달기준으로 이용하기 위해서는 이 비율이외에 차입금평균이자율과 유동부채 비율을 아울러 고려하여야 한다.<br>-부채/자기자본x100<br>(3)자기자본비율<br>-총자산 중에서 자기자본이 차지하는 비중을 나타내는 지표로서 기업 재무구조의 건전성을 나타내는 가장 대표적 지표이다.<br>-자기자본은 직접적인 금융비용을 부담하지 않고 기업이 장기적으로 운용할 수 있는 안정된 자본이므로 이 비율이 높을수록 기업재무 구조는 건전하다고 할 수 있으며 일반적인 표준비율은50%이상으로 보고 있다.<br>-자기자본/총자본x100<br>(4)자본부채비율<br>-총자본/부채총액x100<><br>(5)고정비율<br>-기업자산의 고정화 위험을 측정하는 비율로서 운용기간이 장기에 속하는 고정자산을 어느 정도 자기자본으로 충당하였는가를 나타내는 지표이다.<br>-고정비율은100%이하를 양호한 상태로 보고 있는데 이는 고정적인 자산을 자기자본으로 충당하는 것이 바람직하다는 의미이다.<br>-고정자산/자기자본x100<br>(6)고정장기적합률<br>-고정자산 대 장기자본비율이라고도 한다.<br>-자기자본에 고정부채와 준비금을 보탠 장기자금으로 고정자산을 어느 정도까지 조달하고 있는가를 판단하는데 사용한다.<br>-전력,철강과 같이 설비투자가 큰 업종은 고정자산을 자기자산만으로 조달할 수 없으므로 부족한 자금을 비교적 안정성이 큰 장기부채로 조달한다는 것이 고정장기적합률을 산출하는 이유이다.<br>-이 비율도 고정비율과 마찬가지로100%이하를 표준비율로 보고 있다.<br>-고정자산/(고정부채+자기자본)x100<br>(7)농기구자본비율<br>-기계ㆍ기구ㆍ비품자본액/농업고정자본액x100'],

                </thead>
                <tbody id="resultBody_${category}"></tbody>`;

                tablesDiv.appendChild(table);

                const resultBody = document.getElementById(`resultBody_${category}`);

                matchedData.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item[0] || ''}</td>
                        <td>${item[1] || ''}</td>
                        <td>${item[2] || ''}</td>
                        <td>${item[3] || ''}</td>
                        <td>${item[4] || ''}</td>
                    `;
                    resultBody.appendChild(row);
                });
            }
        }
    });

    if (!hasResult) {
        alert('검색 결과가 없습니다.');
    }
});

// 초기화 버튼 클릭 시 필터 및 검색어 초기화
document.querySelector('h1').addEventListener('click', function() {
    document.getElementById("searchTerm").value = '';
    document.getElementById("tables").innerHTML = '';
});
</script>
</body>
