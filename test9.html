 	    ['농업', '농가경제조사', '조사용어', '수익성지표', '(1) 농업총수입<br>-농업수입(현금,현물)+생산현물가계소비+미처분농축산물증감액+대동식물증감액<br>(2)농업유동재비<br>-농업경영비-(지불노임+지불임차료+지불이자+감가상각비)<br>(3)농업부가가치<br>-일반적으로 각종 농업생산성 지표는 산출액/투입액으로 정의되는데 종전까지 산출액으로 사용해 오던 농업소득 대신에1992년부터는 국제적으로 통용되는 농업부가가치 개념을 사용한다.<br>-농업총수입-(중간재비-감가상각비)<br>ㆍ중간재비=농업경영비-(지불노임+지불임차료+지불이자)<br>(4)농업자본액<br>-농가 경영규모의 척도로서 농업생산에 투입된 자본재 중 재생산 가능한 자본재를 평가한 금액(①+②+③+④)이다.<br>①토지자산(자작지,대부지)의 토지개량,개간ㆍ간척,경지정리,지목변경에 따른 연중증가액 중 투입자본액(구입지불비,자급 재료비,가족노동평가액)<br>②건물 및 구축물과 기계ㆍ기구ㆍ비품,대식물,대동물 등 토지를 제외한 농업용 고정자산의 연말 평가액<br>③미처분농축산물,미사용구입자재,소동물 등 농업용 유동자산에 대한 연말 평가액<br>④1년간 투입된 경상적 농업경영비(감가상각비,미사용구입자재증감 제외)<br>(5)농업노동1시간당 농업소득<br>-농업소득/자영농업노동시간<br>(6)농업노동1시간당 농업총수입<br>-농업총수입/자영농업노동시간<br>(7)단위자본(백만원)당 농업소득<br>- (농업소득/농업고정자본액)x단위자본<br>(8)단위자본(백만원)당 농업총수입<br>- (농업총수입/농업고정자본액)x단위자본<br>(9)단위면적(10a)당 농업소득<br>- (농업소득/경영경지면적)x단위면적<br>(10)단위면적(10a)당 농업총수입<br>- (농업총수입/경영경지면적)x단위면적<br>(11)농업소득률<br>- {(농업총수입-농업경영비)/농업총수입x100'],

 	    ['농업', '농가경제조사', '조사용어', '안전성지표', '(1) 유동비율<br>-단기채무에 충당할 수 있는 유동성자산이 얼마나 되는가를 나타내는 비율로서 기업의 단기지급능력을 판단하는 대표적인 지표로서 일반적으로 표준비율은200%이상으로 보고 있다.<br>-유동자산/유동부채x100<br>(2)부채비율<br>-회사의 부채총액을 자기자본액으로 나눈 백분율로,기업자본 구성의 안전도,특히 타인자본의존도를 표시하는 지표이다.<br>-일반적으로100%이하를 표준비율로 보고 있으나 이와 같은 입장은 여신자 측에서 채권회수의 안전성만을 고려한 것이며 기업경영의 측면에서는 단기적 채무변제의 압박을 받지 않는 한 투자수익률이 이자율을 상회하면 타인자본을 계속 이용하는 것이 유리하다.<br>-따라서 이 비율을 여신자 측에서 채권회수에 대한 위험부담의 측정기준으로 또는 기업경영자 측에서 타인자본의 합리적인 조달기준으로 이용하기 위해서는 이 비율이외에 차입금평균이자율과 유동부채 비율을 아울러 고려하여야 한다.<br>-부채/자기자본x100<br>(3)자기자본비율<br>-총자산 중에서 자기자본이 차지하는 비중을 나타내는 지표로서 기업 재무구조의 건전성을 나타내는 가장 대표적 지표이다.<br>-자기자본은 직접적인 금융비용을 부담하지 않고 기업이 장기적으로 운용할 수 있는 안정된 자본이므로 이 비율이 높을수록 기업재무 구조는 건전하다고 할 수 있으며 일반적인 표준비율은50%이상으로 보고 있다.<br>-자기자본/총자본x100<br>(4)자본부채비율<br>-총자본/부채총액x100<><br>(5)고정비율<br>-기업자산의 고정화 위험을 측정하는 비율로서 운용기간이 장기에 속하는 고정자산을 어느 정도 자기자본으로 충당하였는가를 나타내는 지표이다.<br>-고정비율은100%이하를 양호한 상태로 보고 있는데 이는 고정적인 자산을 자기자본으로 충당하는 것이 바람직하다는 의미이다.<br>-고정자산/자기자본x100<br>(6)고정장기적합률<br>-고정자산 대 장기자본비율이라고도 한다.<br>-자기자본에 고정부채와 준비금을 보탠 장기자금으로 고정자산을 어느 정도까지 조달하고 있는가를 판단하는데 사용한다.<br>-전력,철강과 같이 설비투자가 큰 업종은 고정자산을 자기자산만으로 조달할 수 없으므로 부족한 자금을 비교적 안정성이 큰 장기부채로 조달한다는 것이 고정장기적합률을 산출하는 이유이다.<br>-이 비율도 고정비율과 마찬가지로100%이하를 표준비율로 보고 있다.<br>-고정자산/(고정부채+자기자본)x100<br>(7)농기구자본비율<br>-기계ㆍ기구ㆍ비품자본액/농업고정자본액x100'],

 	    ['농업', '농산물생산비조사', '조사용어', '살균제<br>(fungicide)', '사용목적<br>종자소독제:작물 종자, 종묘의 표피 및 내부에 감염된 미생물을 살멸시키는 것으로 베노밀, 티람, 프로클로라즈, 플루디옥소닐 등이 있다.<br>경엽처리제:작물의 생육기에 줄기, 잎, 과실 등에 감염된 미생물을 살멸시키는 것으로 대부분의 살균제가 이 범주에 속한다.<br>저장병방제제: 수확한 과실 등의 저장 중 부패를 방지하는 것으로 이미녹타딘트리아세테이트, 크레속심메틸, 티아벤다졸 등이 있다.<br>토양소독제: 토양 중의 병원미생물을 살멸시키는 것으로 다조멧, 메탐소듐 등이 있다.<br>작용특성<br>보호살균제(protectant)<br>약제가 식물체 내로 침투하는 능력이 낮아서 병 발생 전(병원균이 식물체 표면에 닿기 전)에 살포하여야 효과를 볼 수 있는 것을 말한다.<br>무기구리제(無機銅劑): 보르도액, 코퍼옥시클로라이드, 코퍼하이드록사이드 등<br>유기구리제(有機銅劑): 옥신코퍼, 프로클로라즈코퍼클로라이드 등<br>무기유황제(無機硫黃劑): (결정)석회황, 황 등<br>유기유황제(有機硫黃劑): 디티오카바메이트계(만코제브, 티람 등)<br>기타: 퀴논계(디티아논), 아릴나이트릴계(클로로탈로닐)<br>직접살균제(eradicant)<br>병원균의 발아, 침입방지뿐만 아니라 침입한 병원균을 살멸시킬 수 있으므로 발병 후에도 사용이 가능한 식물체 내로의 침투력이 있는 것을 말하며, 많은 유기합성 살균제 및 항생물질이 이 범주에 속한다.<br>출처: 농촌진흥청'],

 	    ['농업', '농산물생산비조사', '조사용어', '제초제<br>(herbicide)', '잡초를 방제하기 위하여 사용되는 약제로 사용 장소, 대상 잡초, 처리시기, 처리부위, 선택성 여부 등에 따라 구분할 수 있다.<br>사용 장소: 사용 장소에 따라 논 제초제, 밭 제초제, 과원 제초제, 잔디밭 제초제 등으로 구분한다.<br>대상 잡초: 대상 잡초의 형태적 특징에 따라 광엽(쌍떡잎식물)제초제와 화본과(외떡잎식물)제초제로 구분한다.<br>처리시기<br>발아전 처리제: 잡초가 발아하기 전에 토양에 처리하는 제초제<br>발아후(생육기)처리제: 잡초 발아초기～생육기간 중 토양 또는 경엽에 처리하는 제초제<br>처리부위: 처리부위에 따라 토양처리 제초제, 경엽처리 제초제로 구분한다.<br>선택성 여부<br>선택성 제초제(selective herbicide)<br>특정한 초종에만 약효를 보이는 것으로 대부분의 제초제가 이 범주에 속하며, 실제 포장에는 다양한 잡초가 혼재하므로2가지 이상의 성분을 섞은 혼합제형 제초제가 사용되고 있다.<br>비선택성 제초제(non-selective herbicide)<br>초종에 관계없이 효과를 보이는 제초제로 작물이 자라지 않는 곳(비농경지)에만 사용해야 한다.<br>글리신계: 글리포세이트<br>포스포닉산계: 글루포시네이트암모늄<br>출처: 농촌진흥청'],

 	    ['농업', '농산물생산비조사', '조사용어', '보조제<br>(adjuvant)', '살균제, 살충제, 제초제 등의 효력을 증진시키거나, 사용상 편의를 위하여 사용되는 것으로 보조제 자체는 효과가 없다.<br>전착제(spreader)<br>농약의 주성분을 식물체 또는 병해충 표면에 잘 퍼지게 하거나, 부착시키기 위하여 사용하는 물질로 계면활성제가 주로 사용된다.<br>증량제(diluent, carrier)<br>고체농약 제제 시 주성분의 농도를 낮추고 부피를 증가하여 주성분이 목적물의 표면에 균일하게 부착되도록 사용하는 물질로 활석(滑石, talc), 카올린(kaoline), 벤토나이트(bentonite), 규조토(硅藻土, diatom earth)등이 사용된다.<br>용제(solvent)<br>액상농약 제제 시 주성분을 녹이기 위하여 사용하는 용매로 자일렌(xylene), 벤젠(benzene), 메탄올(methanol), 물 등이 사용된다.<br>유화제(emulsifier)<br>유제의 유화성을 좋게 하기 위하여 사용하는 물질로 계면활성제가 사용된다.<br>협력제(synergist)<br>유효성분의 생물활성을 증대시키기 위하여 사용하는 물질로 피페로닐부톡사이드(piperonyl butoxide), 세사민(sesamin), 세사몰린(sesamolin)등이 주로 사용된다.<br>약해경감제(herbicide safener)<br>제초제는 식물체를 죽이는 약제이므로 작물에 어느 정도 약해를 보이기 때문에 이를 완화하기 위하여 사용하는 것이 약해경감제이며, 펜클로림(fenclorim)이 벼농사용 제초제인pretilachlor에 대한 약해경감제로 사용되고 있다.<br>출처: 농촌진흥청'],

 	    ['농업', '축산물생산비조사', '조사용어', '결핵', '소 결핵병이란 소결핵균<br>(Mycobacterium bovis)이 호흡기 또는 소화기를 통하여 체내로 들어와 증식함으로써 유발되는 동물과 사람의 만성적인 세균성 질병이며, 소모성 질병으로 법정 제2종 가축전염병이다.<br>소결핵은 사람에도 감염되는 인수공통전염병으로 따라서, 결핵병 양성소 농장의 종사자는 소와 직접 접촉에 의한 감염예방을 위해 보호장구를 착용하여야 하며, 양성소는 살처분 전까지는 격리하여야 한다. 또한, 도축업 종사자, 양성소 살처분 종사자는 개인보호장구를 착용하고 작업하여야 하며 보건소에 정기적인 결핵 검진을 받는 것이 좋다.'], 
 	    ['농업', '축산물생산비조사', '조사용어', '조류독감', '조류인플루엔자<br>(Avian Influenza, AI)는 조류인플루엔자 바이러스 감염에 의하여 발생하는 조류의 급성 전염병으로 닭･칠면조･오리 등 가금류에서 피해가 심하게 나타난다. AI바이러스의 닭에서의 병원성 정도에 따라 저병원성과 고병원성 조류인플루엔자로 크게 구분된다.'], 
 	    ['농업', '축산물생산비조사', '조사용어', '아프리카돼지열병<br>(ASF)', '아프리카돼지열병(African Swine Fever, ASF)은 치명적인 바이러스성 출혈성 돼지 전염병이다.이병률이 높고 급성형에 감염되면 치사율이 거의100%에 이르기 때문에 양돈 산업에 엄청난 피해를 주는 질병이다.'], 
 	    ['농업', '축산물생산비조사', '조사용어', '돼지열병', '돼지열병은 국제적으로 지정한 피해가 심한 악성가축전염병으로서 전염성이 매우 강하고 일단 발병하면 치료가 불가한 급성 폐사성 바이러스성 전염병.<br>돼지열병바이러스는 오로지 돼지에게만 발병하며, 사람의 세균성전염병인"와는 병원체, 증상 등이 전혀 다른 가축만의 전염병'], 
 	    ['농업', '축산물생산비조사', '조사용어', '럼피스킨<br>(LSD)', '소의 전신에 지름2∼5㎝의 피부 결절(단단한 혹)이 나타나며, 추가로 유량 감소, 비쩍 마름, 가죽 손상, 유산, 불임, 고열, 침흘림, 눈과 코의 분비물 증가 등의 심각한 생산성 저하를 유발하는 제1종 가축전염병이다.<br>감염 경로는 모기 등의 흡혈 곤충, 바이러스에 오염된 물이나 사료, 직접 접촉, 오염된 주사기 사용 등에 의해 소와 물소만 감염되는 바이러스성 질병이다.폐사율은10%이하로 알려져 있지만, 전염력이 구제역처럼 매우 강해 국내 제1종 법정 가축전염병으로 지정되어 있다.<br>럼피(Lumpy)는 혹이라는 뜻으로, Lumpy Skin병이라는 이름은 피부에 단단한 혹이 난다는 뜻이다.'], 
 	    ['농업', '축산물생산비조사', '조사용어', '브루셀라병', '브루셀라병이란BRUCELLA속 균에 의해 소, 돼지, 산양, 면양, 개 등에서 발생하는 세균성 전염병으로 암소에서는 불임증 및 임신 후반기 유·사산을 일으키고 수소에서는 고환염을 일으키는 질병으로 가축전염병예방법상 제2종 가축전염병이며 OIE지정전염병임<br>전염성 유산(CONTAGIOUS ABORTION) 또는 BANG’S DISEASE로도 불리며, 한번 발생하면 농장 내에서 지속적으로 반복 발생하여 유량감소·체중감소가 일어나고, 유·사산, 불임 등으로 송아지 생산이 감소되어 축산농가에 큰 경제적 피해를 입힘<br>이 질병은 사람(주로 축산업 관련 종사자:농장·도축장 종사자, 수의사, 인공 수정사, 채혈요원, 실험실 근무자 등)도 감염되는 인수공통전염병으로 동물에서 나타나는 임상증상과는 달리 사람에서는 감기와 유사한 증상을 보임<br>발열이 불규칙하게 일어나기 때문에 파상열(UNDULANT FEVER)이라고 불리며, 지중해의 말타섬에서 사람 감염사례가 처음 발견되어 말타열(MALTA FEVER)이라고도 함.'],

	    ['농업', '농가판매및구입가격조사', '조사용어', '농가판매가격지수', '농업경영활동으로 생산된 농산물 및 축산물 등 75개 품목의 2020년 기준(2020=100)의 가격지수'],

 	    ['단위', '농작물', '조사용어', '되', '되 또는 승(升)은 부피를 재는 단위로 한 되는1.8리터 정도의 부피이다.또한 부피를 재는 도구의 이름이기도 하다.<br>한 되는 열 홉이고, 열 되는 한 말이다.'], 
 	    ['방언', '농작물', '조사용어', '말', '말은 부피를 재는 단위로 한 말은 18리터 정도의 부피이다. 두(斗)라고 하기도 한다.한 말은 열 되이고, 열 말은 한 섬이다. 한 말의 씨앗을 뿌려 농사를 지을 만한 넓이의 땅을 마지기라고 한다.'], 
 	    ['방언', '농작물', '조사용어', '섬', '섬 또는 석(䄷)은 척근법의 하나로, 부피의 단위이다. 한 섬은 용량 180리터이며, 곡식의 종류나 상태에 따라 무게가 달라진다. 벼는 200 kg, 쌀은144kg, 보리쌀은 138kg이다. 한 섬은 열 말이다. 신라시대 부피의 단위인 점(苫)에서 유래했으며, 신라시대의 점은 15말이었다. 최치원의 〈연복사비문〉(演福寺碑文)주석에 ‘유제일두위점(斞除一斗爲苫) 십육두위유(十六斗爲斞)’라고 적혀 있는데, 당시에는 유(斞: 16말)에서 1말을 뺀 15말을 점이라고 했음을 알 수 있다.'], 
 	    ['방언', '농작물', '조사용어', '평', '평(坪)은 척관법에서 쓰이는 단위이다. 주로 넓이에 쓰이나, 부피를 비롯한 다른 단위에도 쓰인다. 넓이에 쓸 때는 보(步)라고도 한다.<br>넓이 1평은 여섯 자 평방이며, 곧 길이 여섯 자를 한 변으로 하는 정사각형의 넓이를 나타내므로, “6자×6자”를 뜻한다. 미터법으로 환산하면 약 3.3058제곱미터(400/121 ㎡)이다. 보통 3.3제곱미터를 1평으로 본다. 이 단위는 한 사람이 팔과 다리를 벌리고 누울 수 있는 넓이에서 기원했다. 넓이 1평은 1보(步)라고 표기할 수 있다.<br>아파트나 주택 및 대지의 넓이를 나타낼 때 쓰였다. 일반적으로 원룸 아파트는 10~15평, 주택은 50평, 가장 작은 침대방은 1.5평 정도이다.<br>한국 산업 규격은 평 대신 제곱미터를 쓰도록 규정하고 있다. 대한민국 산업자원부는 2007년 7월 1일부터 평 단위 사용을 전면 금지하였으며, 이를 위반시 50만 원 이하 과태료를 부과한다.'], 
 	    ['방언', '농작물', '조사용어', '단보', '단(段)은 동아시아의 도량형인 척관법에서 쓰는 넓이의 단위이다. 단보(段步)라고도 한다.<br>일본제국 및 대한제국에서 제정한 도량형에 따라 미터법으로 환산할 수 있다.<br>단은 땅의 넓이를 셀 때만 쓰는 단위로서 1단은 300평이다. 미터법으로는 120,000/121제곱미터(약991.74 ㎡)이다.'], 
 	    ['방언', '농작물', '조사용어', '정보', '정(町)은 동아시아의 도량형인 척근법에서 쓰는 단위이다. 정보(町步)라고도 한다.<br>일본제국 및 대한제국에서 제정한 도량형에 따라 미터법으로 환산할 수 있다.<br>길이 1정은 60간(間)이며, 미터법으로는 3600/33미터로서 약109.09미터 또는 10909.1센티미터이다.<br>땅의 넓이 1정은 10단(段), 곧 3000평이다. 미터법으로는 1,200,000/121제곱미터(약9917.36㎡)이다.'], 
 	    ['방언', '농작물', '조사용어', '돈', '돈(匁)은 무게의 단위로 1돈은 약3.75g이다. 10돈은 1냥이다. 돈쭝이라고도 부른다. 화폐 단위인 전(錢)과는 다르다.'], 
 	    ['방언', '농작물', '조사용어', '냥', '냥(兩) 또는 량(兩)은 무게의 단위로서 냥쭝이라고도 부르며, 10돈 또는 37.5g이다. 16냥은 1근(斤)이 된다. 약 37.5그램중이고, 약재의 경우는 4돈쭝(약 15그램중)을 1냥쭝으로 취급한다. 흔히는 중국의 무게와 통화 단위의 일부를 일컫는 것이지만, 조선의 통화나 근세 일본의 금화에서도 같은 단위를 썼다.<br>약간 다른 곳에 사용하는 단위이기는 하지만, 대만, 홍콩, 동남아시아에서는 10전(錢) 또는 1/16근(斤)과 동일한 가치를 지녔다. 이러한 중국의 도량형은 보통 금이나 은의 교환뿐만 아니라 한약재를 측정하는 단위에도 사용되었다.'], 
 	    ['방언', '농작물', '조사용어', '근', '근(斤)은 질량과 무게의 단위이며, 1근은 16냥 또는 160돈이며, 미터법으로는 약 600g이다.<br>오늘날 고기를 측정할 때 1근은 16냥으로 약 600그램에 해당하고, 과일이나 채소 따위를 잴 때는 한 관의 10분의1, 곧 1냥의 10배로 375그램에 해당한다.<br>약재의 경우 약재 40냥을 1근으로 보는데, 이때 약재 1냥은 4돈(약15g)이므로, 1근은 160돈이고 미터법으로는 약 600g이다.'], 
 	    ['방언', '농작물', '조사용어', '관', '관(貫)은 질량과 무게의 단위로1관은6.25근 또는100냥 또는1000돈이며, 미터법으로 약3.75kg이다.'], 
 	    ['단위', '농작물', '조사용어', '단지', ' '], 
 	    ['단위', '농작물', '조사용어', '방구', ' '], 
 	    ['단위', '농작물', '조사용어', '필지', '필지(筆地), 필(筆)은 구획된 논이나 밭, 임야, 대지 따위를 세는 단위이다. 땅에 대한 소유권이나 건물이 앉은 터를 기준으로 해서, 토지 구역 경계로 갈라 정한 국토를 등록하는 기본단위이다. 필지는 도시에서 용도지역, 용도지구를 구분하는 도시계획에서 기초 단위이다. 개별 필지는 지번과 지목을 가지고 있고, 도시지역에 있는 필지는 토지이용계획이 부여된다.<br>기존 시가지는 산, 언덕, 하천, 도로 따위의 지형에 따라 필지 형상이 비정형으로 만들어져 있으나, 도시가 형성됨에 따라 택지 개발이나 재개발 따위로 도로와 직교하는 토지구획선을 그어 정형화되는 경우가 많다. 농촌에서도 토지구획정리 사업 따위로 논, 밭 따위 농지를 정형화하기도 한다.'], 
 	    ['단위', '농작물', '조사용어', '다랑치', '산골을 따라 형성된 경지정리가 되지 않은 소규모 논'], 
 	    ['단위', '농작물', '조사용어', '말가웃지기', '‘볍씨 한 말 반쯤의 분량으로 모를 길러 심을 수 있는 크기의 논’(약 300평)을 뜻함.'], 
 	    ['단위', '농작물', '조사용어', '마지기', '마지기는 농지의 면적을 세는 단위로 씨 한 말을 뿌려 농사를 지을 만한 크기의 농지를 말한다. 이두로는 斗洛只로 썼는데 차자표기법을 잘 모르게 되자 이를 한자음으로만 그대로 읽어 두락지라고 잘못 읽기도 하였다. 마지기와 비슷한 용어로 되지기가 있는데, 되지기와 마지기 모두 단위가 분명하지 않다. 논은 약150~300평, 밭은 약100평 정도이다. 마지기의 크기는 지역에 따라 차이가 있다.경기지역에서 말하는’한 마지기’는 150평이지만 충청지역에선 200평, 강원지역에선 300평 또는 150평을‘한 마지기’라고 한다. 쌀의 경우 한 마지기의 논에서 3~4가마의 소출이 나온다.'], 
 	    ['방언', '농작물', '조사용어', '머구/머우', '머위의 방언(전남)'], 
 	    ['방언', '농작물', '조사용어', '폿', '팥의 방언(전남)'], 
 	    ['방언', '농작물', '조사용어', '부추', '부추는 지역에 따라 불리는 이름도 제각각이다.수도권이나 강원도에서는 부추, 전라도에서는 솔, 충청도에서는 졸, 경상도에서는 정구지라고 한다.'], 
 	    ['방언', '축산물', '조사용어', '뿌사리', '‘황소(숫소)’의 방언(전남)'], 
	    ['어업','어업생산동향조사','조사용어','어업(漁業)','보통의 의미로는 자연계에서 서식하는 수산동식물을 채취하거나 포획하는 일을 어로(漁撈)라 하며,사업의 목적으로 하는 어로활동을 어업,오락의 목적으로 하는 어로를 유어(遊魚:sports fishing)라 한다.<br>그러나 어업이라는 말은 경우에 따라서 가리키는 범위가 다소 다르다.<br>가령,수산업법 제2조의 경우는‘어업이란 수산동식물을 채취·포획 또는 양식하는 사업을 말한다’라고 규정하고 있어서 양식 사업도 어업에 포함시키고 있다.<br>또,때로는 이보다 더 넓게 양식업 뿐만 아니라 수산제조업까지도 포함하여 수산업과 같은 뜻으로 쓰이는 경우도 있다.<br>특히,영어의fishery라는 말은 어업이라는 뜻과 수산업이라는 뜻으로 혼용되고 있다.<br>어업이라는 말이 가리키는 범위는 이와 같이 경우에 따라 다소 다르나,어느 경우에나 수익성을 목적으로 하는 사업이라는 점은 같다.<br>즉,어업은 생산에서 판매에 이르는 일련의 과정이 경제적으로 수행되어 최소의 노력으로 최대의 이익을 올려야만 한다.<br>어업은 대상물의 종류,근거지,잡는 방법,경영방법,법규상의 규정 등에 따라 여러 가지로 나눌 수 있다.'],
	    ['어업','어업생산동향조사','조사용어','내수면어업','내수면어업은 내수면,즉 육지에 있는 수면에서 하는 어업으로,하천·수로·저수지 등 그 밖에 인공적으로 조성된 담수나 기수(바닷물과 민물이 섞인 물)의 흐름 또는 수면을 말한다.<br>①어로어업:도구를 이용하거나 맨손으로 수면에서 수산 동식물을 포획 채취하는 어업<br>②양식업:인위적인 시설물을 설치하여 유용수산물을 길러서 수확하는 어업<br>○조방적 양식:제한된 범위 안의 넓은 수면적에 낮은 밀도의 양식생물을 유지 관리하는 양식 방법.<br>○집약적 양식:양식업자에 의해 큰 단위로 관리되는 고밀도 양식생물을 사육하는 방법으로 유수식,순환여과식,가두리식 등이 있다.'],
	    ['어업','어업생산동향조사','조사용어','해면어업','해면어업은 바다에서 하는 어업으로서,보통 연안어업(沿岸漁業)·근해어업(近海漁業)·원양어업(遠洋漁業)으로 나눈다.<br>통념상으로 연안어업이란 근거지나 육지로부터 하루 만에 돌아올 수 있을 정도로 가까운 바다에서 하는 어업이고,수십 일이 걸리는 먼 바다에서 하는 어업을 원양어업이라 하며, 그 중간 정도의 곳에서 하는 어업을 근해어업이라 한다.<br>그러나 이 기준은 대단히 모호하고,또 항해 운용술의 발달에 따라 달라진다.'],
	    ['어업','어업생산동향조사','조사용어','연안어업','무동력어선 또는 총톤수10톤 미만의 동력어선을 사용하는 어업으로서 근해어업 및 구획어업 이외의 어업'],
	    ['어업','어업생산동향조사','조사용어','근해어업','총톤수10톤 이상의 동력어선 또는 수산자원의 보호와 어업조정을 위하여 특히 필요하여 대통령령이 정하는 총톤수10톤 미만의 동력어선을 사용하는 어업'],
	    ['어업','어업생산동향조사','조사용어','원양어업','동해·황해 및 동중국해와 북위25도선 이북 동경140도선 이서의 태평양수역을 제외한 해역을 해외수역이라 하며,해외수역을 조업구역으로 하는 어업'],
	    ['어업','어업생산동향조사','조사용어','양식업','유용한 수산 동식물을 영리를 목적으로 인위적으로 관리하여 생산하는 것<br>①바닥식 양식<br>-수면의 바닥을 이용하거나 수면의 바닥에 투석식 시설을 하여 유용수산동식물을 양식하는 방법으로 패류(굴,바지락,가무락,대합,동죽,피조개,<br>꼬막류 등),해조류(돌김,미역,다시마 등),유용수산동물(갯지렁이,해삼,개불 등)을 대상으로 한다.<br>㉮살포식 양식(씨뿌림 양식):간석지 등 수면의 바닥에 종묘를 뿌려서 성장 관리하여 생산하는 것<br>㉯투석식 양식:수면의 바닥에 돌,시멘트구조물,기타의 구조물을 시설하여 수산생물의 유생이 부착하거나 은신처제공 등 인위적으로 관리하여 생산하는 것<br>㉰송지식 양식:간석지 및 수면의 바닥에 나뭇가지를 꽂아 유생이나 포자의 부착이 이루지면 관리하여 생산하는 것<br>㉱말목식(지주식)양식:수심10m이내의 바닥에 나무,철근,플라스틱 등의 말목을 박고 이곳에 수평으로 발 또는 끈 등을 매달아서 수산생물이 부착 성장하도록 관리<br>하여 생산하는 것<br>②수하식 양식<br> -양식대상 생물을 수중에 매달아 기르는 것 바닥식 양식방법보다 생장이 좋고 바다를 입체적으로 이용하기 때문에 생산성이 높다.<br> -패류(굴,진주 조개,진주담치,가리비 등),해조류(김,미역,다시마,파래 등)수산동물(멍게,미더덕,오만둥이 등)을 대상으로 하며,시설방법에 따라 땟목식,연승수하식,부류식,간이수하식(말목수하식),우산식 등으로 구분한다.<br>㉮뗏목식 양식<br> -대나무 또는 플라스틱 등으로 땟목을 만들어 부의를 달아 부력을 크게 하여 바다에 띄워 수하연을 달아서 굴 홍합 등을 양식하는 방법<br>㉯연승수하식(밧줄식,로프식)<br> -플라스틱이나 스티로품으로 만든 뜸을 해면에 띄워 놓고 이것을 밧줄(로프)로 연결해서 밧줄의 양끝을 닻이나 멍(돌주머니)으로 고정시킨 다음 밧줄에 수하연을 매달거나 밧줄에 씨줄을 감아서 양식하는 방법으로 굴,홍합,가리비,우렁쉥이,미더덕,오만둥이,미역,다시마,톳 등을 양식 함<br>㉰부류식 양식(뜸발식)<br> -말목식과 달리 해조류의 부착기질인 발을 수면에 띄우기 위하여 발에 뜸을 설치하고 발의 사방모서리나 중간에 밧줄로 연결하여 끝은 닻으로 고정하여 시설물을 설치하여 김,파래,매생이 등을 양식하는 방법<br>㉱간이수하식(말목수하식)<br> -간조선 근처에서 수심4m정도 되는 간석지에 말목(철근,목재,플라스틱)을 바닥에 고정하고 수평으로 걸대를 시설하여 걸대에 수하연을 달아매서 비교적 얕은 연안에서 실시하는 양식 방법으로 주로 굴채묘 및 양식에 활용<br>㉲우산식 양식<br> -간석지에 말목을 박고 말목과 지면사이를 줄로 우산살처럼 펼쳐 시설하여 굴,김,파래,등을 양식하는 방법이며 현재는 생산성 저하로 거의 시설이 되지 않고 있는 고전적인 양식방법임<br>㉳수평망식(가상식)<br> -간석지에 평면으로 종횡의 구조물을 직교되도록 연결시킨 걸대에 플라스틱의 양성망을 올려놓고 양성망내에 개체굴을 넣어서 양식하는 방법'],
	    ['어업','어업생산동향조사','조사용어','축양(畜養)','일정한 기간 동안 수산 동물을 살려 두는 것을 목적으로 적절한 시설 속에 수용해두는 것을 말한다.<br>이 기간 동안은 성장시키는 것이 목적이 아니고,많이 잡힐 때 수용해 두었다가 적게 잡히는 시기에 팔아서 이익을 얻는 것을 목적으로 한다.'],
	    ['어업','어업생산동향조사','조사용어','마을어업(면허어업):수산업법 제8조(면허어업)','일정한 지역에 거주하는 어업인이 해안에 연접한 수심(水深)이내의 수면을 구획하여 패류(전복,굴,등),해조류(김,미역,다시마 등)또는 정착성(定着性)수산동식물을 관리․조성하여 포획․채취하는 어업을 말한다.<br>※정착성 수산동물:문어,낙지,우렁쉥이,성게,군소,해삼,게 등<br><어업면허의 관리 등에 관한 규칙에서 마을어업><br> -제11조(마을어업의 포획․채취방법 등)마을어업권자는 마을어업의 어장구역에서 수산동식물을 포획․채취하는 경우에는 수산업법 제8조,제2호 및 제4호에 따라 다음 각 호의 어구를 사용하여 이를 포획․채취하여야 한다.다만,마을어업의 어장구역의 수심이 깊어 다음 각 호의 어구에 따른 수산동식물의 포획․채취가 불가능한 곳에서는【별표3】에서 정하는 포획․채취방법에 따른다.<br> 1.낫․호미․칼․괭이 또는 삽<br> 2.해조틀이 또는 갈퀴류<br> 3.통발 및 문어단지<br> 4.추진 장치가 없거나 고무줄을 이용하는 작살류<br>예)마을어업내에서 포획․채취를 하는 수산동물 중 어류(전어종)는『어류는<br>실제 조업한 어법으로 조사』,단,어류를 작살로 잡았을 경우에는 마을어업으로<br>조사한다.<br>※마을어업은1년중 해수면이 가장 낮은 때의 평균수심5미터 이내(강원,경북,제주7미터)의 수면에 대해 면허하고 있으며 면허된 수면의 패류․해조류 또는 정착성 수산동물을 관리․조성하여 포획·채취하는 어업을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','한정어업면허:수산업법 제15조(면허제한구역 등에 대한 한정어업면허)','-8조(면허 어업)에 따른 어업면허(이하“한정어업면허”라 한다)를 할 수 있다.<br> -동법③호에 의거,시장․군수․구청장은 한정어업면허를 할 때 관계 행정 기관이 다른 법령에 따른 보상을 배제하는 조건으로 협의하거나 승인할 때에는 그 조건을 붙여 면허하여야 한다.<br>※한정어업면허를 받아 어업을 할 경우 수산물에 대해서는 양식업으로 처리하여서는 안되며,양식면허를 받은 경우에만 양식으로 처리하고 그러하지 않은 경우는 어로어업으로 처리한다.'],
	    ['어업','어업생산동향조사','조사용어','한시어업허가:수산업법(제42조)','-․도지사는 그 동안 출현하지 아니하였거나 현저히 적게 출현하였던 수산 동물(수산자원관리법 제48조에 따른 수산자원관리수면 지정대상 정착성 수산 자원은 제외한다)이 다량 출현하고 이를 이용할 어업이 허가되지 아니한 경우에 해당 수산동물의 적절한 이용․관리를 위하여「수산자원관리법」제11조에 따라 수산자원의 정밀조사․평가를 실시하고 그 결과에 따라 해양수산부장관의 승인을 받아 다음 사항을 정하여 한시적으로 어업(이하“한시어업”이라 한다)을 허가할 수 있다.<br> -동법③호에 의거,시․도지사는 다음 각호의 어느 하나에 해당하는 사유가 있으면 한시어업을 허가하여서는 아니 된다.<br> 1.어업분쟁이 있거나 어업질서의 유지가 필요한 경우<br> 2.한시적으로 포획하려는 수산동물과 동일한 품종을 주로 포획대상으로 하는 어업의 어로활동에 지장이 있는 경우<br> 3.대통령령으로 정하는 연구기관의 장이 수산자원의 번식․보호에 지장이 있거나 해양생태계에 미치는 영향이 있다고 인정하는 경우'],
	    ['어업','어업생산동향조사','조사용어','가두리양식<br>cage culture<br>가두리養殖','수산생물을 가두어 두는 우리에서 생겨난 말로 보통 호소나 바다에서 어류를 가두어 양식하는 시설이다.그물이나 플라스틱 피복 철망 또는 플라스틱 망으로 만들며,이는 그물코를 통하여 안팎의 물이 자유로이 통과하므로,많은 양의 어류를 수용하여 길러도 수질이 나빠지지 않는다.따라서 작은 시설에 많은 양의 어류를 기를 수 있어 시설 면에서는 매우 경제적이다.'],
	    ['어업','어업생산동향조사','조사용어','간석지<br>tideland, beach at ebb tide<br>干潟地','얕은 해안이 간조 되면 간출하는 모래,모래 개흙 또는 개흙질인 곳을 일컫는다.조개류나 고둥류,갑각류,관서 다모충류,극피동물,개불류 등이 지질 속에 잠입하여 살고 있다.'],
	    ['어업','어업생산동향조사','조사용어','감모<br>decrease<br>減耗','종묘생산 및 양식과정에서 점차적으로 개체수가 줄어드는 현상을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','각망<br>stationary net of rectangular shape<br>角網','대모망의 일종으로 육지에서 바다쪽으로 길그물을 부설하고,그 끝에 직사각형의 통그물을 부설하여 놓고 길그물에 의해 유도된 어군을 잡는 어구이다.'],
	    ['어업','어업생산동향조사','조사용어','갯녹음<br>whitening<br>白化,磯燒現象','해조류가 번무하고 있던 암초지대에서 어떤 원인으로 해조류가 고사,소멸하고 그 공간을 석회조류로 불리는 여러 종류의 산호조류(coralline algae)가 피복하여 이들이 살았을 때는 분홍색으로 보이나 죽어서는 암반이 백색으로 변하는 현상을 말한다.백화현상 또는 기소현상(일본)이라고도 한다.'],
	    ['어업','어업생산동향조사','조사용어','강하성어류<br>catadromous fish<br>降河性魚類','뱀장어와 같이 강에서 성장을 하고 산란을 하기 위하여 바다로 내려가는 담수어류를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','공해<br>high sea, open sea<br>公海','공해는 배타적 경제수역(exclusive economic zone),영해(territorial sea),내수 또는 군도국(archipelagic State)의 군도수역(archipelagic waters)에 포함되지 않는 해양의 대부분이다. (유엔 해양법 협약 제86, 87조)공해는 연안국이나 내륙국에 관계없이 모든 국가에 개방된다.공해의 자유는 항행,어업,해저 전선과 파이프라인의 매설,상공비행,인공도서 및 기타 시설 건설,과학적 조사 등의 자유 보장으로서 공해 사용의 자유를 인정한 것이다.'],
	    ['어업','어업생산동향조사','조사용어','급여량feeding amount給與量','먹이로 공급하는 먹이의 무게.일반적으로 양식 생물의 체중에 대해 하루에 주는 건조상태인 먹이의 중량을 말한다.이와 같은 양을 하루 동안에 몇 번으로 나누어 준다.먹이 주는 횟수가 많을수록 일손은 들지만,먹는 양은 증가하기 때문에 먹이의 손실이 적다.먹이를 먹는 양이 먹이를 주는 먹이량에 가까울수록 좋다.'],
	    ['어업','어업생산동향조사','조사용어','강어귀 바닷물(기수)<br>brackish water<br>汽水','담수와 해수의 중간정도 수역으로서 염분이0.5∼30‰의 수역을 말하며,강과 바다가 만나는 강 하구나 해안부근의 호소가 여기에 속한다.'],
	    ['어업','어업생산동향조사','조사용어','단위노력당어획량(CPUE)<br>catch per unit effort<br>單位努力當漁獲量','총 어획량을 총 어획 노력으로 나눈 것을 단위 노력 당 어획량이라고 하며,이는 자원량 지수로서 사용된다.즉 단위노력(선박,사람,낚시)에 따른 개별 어획량을 나타내는 것으로서 연승어업의 경우라면1상자 당 어획량을 의미하고,채 낚기 어업의 경우는1사람당 어획량을 의미한다.'],
	    ['어업','어업생산동향조사','조사용어','남획<br>over fishing<br>濫獲','자원의 자연증가량보다도 어획량이 커져서 자원이 감소하는 경우이다.즉,최대 재생산량에서 자연사망을 뺀 나머지 양보다 더 많은 양을 어획하는 것을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','단련종묘<br>hardened seed<br>鍛鍊種苗','채묘기(採苗器)에 부착시킨 치패(稚貝)를 단련상(鍛鍊床)에 얹어 종묘로 사용할 때까지 성장을 억제시켜 건강하게 관리하여 만든 종묘.이와 같은 종묘는 해수중(海水中)에 잠기는 시간이 짧아 성장이 억제됨과 동시에 햇빛이나 풍파에 시달려 패각(貝殼)의 성장선(成長線)부근이 튼튼하고,공중활력(空中活力)이나 저항력이 크고,양성장(養成場)에다 옮겨 양성하면 성장이 아주 빠르다.'],
	    ['어업','어업생산동향조사','조사용어','담수어업<br>fresh water fishery<br>淡水漁業','내수면어업이라고도 하며 이것을 다시 가르면 하천 어업과 호소어업으로 가를 수 있다.'],
	    ['어업','어업생산동향조사','조사용어','대륙붕<br>continental shelf<br>大陸棚','간조선에서 수심200m까지의 바다를 말하고,육지의 주변에 있어 하천수에 의한 영양염의 공급도 많아 해양에서 생물 생산이 많은 곳이다.'],
	    ['어업','어업생산동향조사','조사용어','못양식<br>pond culture<br>池養殖','못에서 양식하는 것.지수식과 유수식이 있다.또 실뱀장어에서 종묘까지,종묘에서 상품 크기까지 기르는 것과,관리하고 있던 어미로부터 채란,부화,유생 사육,종묘 및 상품 크기까지 기르는 것이 있다.이들 각 단계별로 알맞은 못이 필요하게 된다.'],
	    ['어업','어업생산동향조사','조사용어','미성어<br>fingerling<br>未成魚','상품으로 출하되는 크기는 아니고 치어보다 약간 큰 어류,전장 약2∼20cm사이의 어류를 지칭한다.'],
	    ['어업','어업생산동향조사','조사용어','밀식<br>overcrowding<br>密殖','양식할 때 여러 가지 환경조건 등에 따라 단위 면적당 알맞은 양식량이 있으나,이것을 넘어 대량으로 양식하는 것을 밀식이라 한다.밀식하게 되면 성장이나 품질이 떨어질 뿐만 아니라,병해 발생과 수질이나 저질의 악화 등에 따라 대량 폐사를 가져오는 수가 있다.'],
	    ['어업','어업생산동향조사','조사용어','바닥식양식<br>底面養殖','수면의 바닥을 이용하거나 수면의 바닥에 투석식 시설 등을 하여 어류,패류 등을 양식하는 방법이다.'],
	    ['어업','어업생산동향조사','조사용어','배합사료<br>formulated food<br>配合飼料','어류의 영양요구를 충족시킬 수 있는 여러가지 사료원료를 배합한 사료를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','복합양식<br>polyculture<br>複合養殖','같은 양식장에서 두 종 혹은 그 이상의 비경쟁적인 어종을 함께 길러 사료 경제성을 높이는 양식방법을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','부상사료(EP)<br>extruded pellet<br>浮上飼料','고온,고압상태의 금형 틀 안에서 사료원료가 통과하는 과정으로 만들어진 사료,사료는 금형을 통과,빠져나오면서 팽창하여 펠릿으로 만들어지며,물에 부유성이 된다.'],
	    ['어업','어업생산동향조사','조사용어','부자<br>float<br>浮子','어구를 위쪽으로 지지하기 위한 부속구를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','발돌 또는 침자(沈子)','발돌 또는 침자란 물속에 어구를 가라앉게 하거나 그 형상을 유지시키기 위하여 어구에 부착하는 물건을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','부착치패<br>附着稚貝','패류의 부유 유생이 수중의 다른 물질에 부착하여 부착 생활을 하는 치패이다.패각으로서 부착하는 것(굴류)과 족사로써 부착하는 것(담치류,진주조개,가리비,피조개 등)이 있고 또 일생동안 부착 생활을 하는 것과 일정기간 부착 생활을 한 다음,바닥 생활로 들어가는 것이 있다.부착성 치패는 채묘기를 알맞는 수층에다 넣어 채묘하여 종묘로서 사용한다.'],
	    ['어업','어업생산동향조사','조사용어','사육밀도<br>飼育密度','단위 면적 또는 단위 체적 중에 사육하고 있는 양식동물의 밀도를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','선별<br>selection<br>選別','양식생물의 효과적인 관리를 위하여 생물의 크기별 또는 단계별로 나누어 분리하는 것으로 적당한 크기의 망목을 가진 물러가제 또는 특수하게 제작 되어진 선별기를 이용하여 선별한다.'],
	    ['어업','어업생산동향조사','조사용어','성숙<br>mature<br>成熟','생물이 각각 종(種)으로서의 특징을 충분히 발휘할 수 있게 되는 것.식물의 성숙은 꽃이 피고 열매를 맺을 수 있는 상태가 되는 것을 말하고,동물의 경우도 생식 능력을 가진 상태로 여러 가지 형질이 완성되는 것을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','소하성어류<br>anadromous fish<br>溯河性魚類','산란(産卵)를 위하여 바다에서 하천으로 올라오는 물고기의 총칭.연어·송어류가 대표적이며 은어처럼 어릴 때 강으로 올라오는 것도 포함된다.비중이 다른 바다에서 강으로 올라오기 위해서는 삼투압의 변화에 견디어야 하는데 이것을 조절하는 데는 내분비선이 관련된다는 사실이 밝혀졌다.연어 알은 담수에서는 잘 부화하지만 염수에서는 부화하지 않는다.'],
	    ['어업','어업생산동향조사','조사용어','수산자원보호령<br>fisheries resources protection decree<br>水産資源保護令','수산자원의 번식보호와 어업질서의 확립을 도모하고 어업생산의 유지발전에 기여함을 목적으로 하는 수산관련 법령이다.'],
	    ['어업','어업생산동향조사','조사용어','순환여과식<br>water recirculation system<br>循環濾過式','사육수를 드럼필터 및 여과재 등과 같은 생물학적 여과를 통해 재처리하여 다시 활용하는 양식방법을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','수산업<br>fisheries, fishing<br>水産業','바다·호수·하천 등 물 속에 사는 생물을 인류생활에 유용하도록 이용·개발하는 산업.수산업의 생산물을 수산물이라 한다.이런 의미의 수산업은 수산물을 생산하는 업태(業態)에 따라 크게 어업·양식업·수산가공업으로 나눈다.어업은 천연의 수산생물을 채취하거나 포획하는 사업을 말하고 양식업은 수산생물을 인위적으로 번식·조장하는 사업이다.수산가공업은 어업·양식업의 생산물을 원료나 재료로 하여 보존식품 등을 생산하는 사업을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','수직회유<br>vertical migration<br>垂直回遊','동물플랑크톤(zooplankton)의 대부분이24시간을 주기로 야간에는 표층으로 주간에는 심층으로 수직이동을 하는데,이를 동물플랑크톤의 수직회유 또는 주야수직이동(diurnal vertical migration)이라 한다.동물플랑크톤의 수직이동거리는500m에 이르는 것도 있으나,소형 동물플랑크톤의 경우에는10m정도이다.수직회유의 이유는①낮에는 식물플랑크톤(먹이생물)이 많은 표층으로,밤에는 포식자가 적은 심층으로 이동함으로써 동물플랑크톤이 다른 종과의 경쟁을 최소화하기 위함과②먹이를 먹지 않는 밤 동안 수온이 낮은 심층에 있음으로써 신진대사율을 떨어뜨려 에너지를 보존하기 위한2가지가 주된 이유로 받아들여지고 있다.이렇게 동물플랑크톤은 수직회유를 함으로써 개체의 성장률을 높이게 되고 나아가군집의 생존을 유지한다.'],
	    ['어업','어업생산동향조사','조사용어','습사료(MP)<br>moist pellet<br>濕飼料','배합 사료와 생먹이를 약1:1의 비율로 혼합한 수분이 많은 펠렛상 사료로서,그 수분이30∼41%나 함유하기 때문에 장기간 보존하는데는 적합하지 않다.해수어인 방어나 돔류에서 많이 사용하고 있고,생선이나 냉동어와 배합 사료와의 비율은 여러가지이며,최근에는 배합 사료 단독형인 모이스트 펠릿이 개발되어 사용되고 있다.'],
	    ['어업','어업생산동향조사','조사용어','양망기<br>net hauler<br>揚網機','그물을 감아올리는 데 쓰이는 기계를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','썰물<br>ebb tide','만조에서 간조로 될 때 수위가 낮아지면서 빠져나가는 해수의 이동.밀물에 대응되는 말이다.만조(滿潮)에서 간조(干潮)사이에 해면이 점차 내려가는 사이를 가리킨다.썰물과 밀물의 간격은 평균12시간25분으로 매일50분 정도씩 늦어진다.'],
	    ['어업','어업생산동향조사','조사용어','양성<br>養成','종묘(종자)로부터 상품이 될 수 있는 크기 또는 어미가 되도록 기르는 일을 말하고,이와 같은 일을 하는 장소를 양성장이라 한다.'],
	    ['어업','어업생산동향조사','조사용어','양식시설<br>aquaculture facility<br>養殖施設','양식업에 있어서 종묘생산 및 양성에 있어 필요한 각종 시설을 통틀어 말한다.즉 탱크,채묘기,뜸틀,채롱,못 및 양식 면적 등이다.'],
	    ['어업','어업생산동향조사','조사용어','어구<br>fishing gear<br>漁具','수산동식물을 포획․채취하는 데에 직접 사용되는 도구를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','어군<br>fish school, fish shoal<br>魚群','생태적으로나 형태적으로 동일한 어종이 같은 행동을 하며 무리를 이루는 것으로 어업적 측면에서는 대단히 중요하다.물고기가 군을 이루는 성질은 어종에 따라 일생 동안 군을 이루는 것(송사리·정어리 등),생활사의 어떤 시기만 군을 이루는 것,일생 고독한 것(개복치·상어 등)으로 나눌 수 있다.대부분의 물고기는 어린 시기에는 모두 군을 이루며,회유성(回游性)도 강한 것이 일반적이다.대표적인 것으로서는 멸치·정어리·가다랭이·고등어·전갱이·다랑어·연어·꽁치·방어 등이 있다.저서어족(底棲魚族)인 도미·대구 등도 군을 이루는 성질이 강하다.또 군을 형성하는 것은 일반적으로 시각(視覺)에 의존하는 경우가 많다는 것이 여러모로 증명되었다.'],
	    ['어업','어업생산동향조사','조사용어','어기<br>fishing season<br>漁期','일정한 수역(水域)에 특정한 어종(魚種)이 대량으로 나타나 상당 기간 체류하거나 또는 군을 이루어 차례로 통과함으로써 그 어종을 대상으로 한 어업이 경제적으로 이루어지는 기간을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','어로<br>fishing<br>漁撈','물속에 사는 생물 즉 어류,패류 및 조류 등을 채취하거나 포획하는 작업을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','어분<br>fish meal<br>魚粉','어체 전부 또는 불가식부(不可食部)를 자숙(또는 증자),압착,건조,분쇄 등의 공정을 거쳐 분말상의 고형물로 만든 것을 말한다.원료어의 육질에 따라 백색 어분과 갈색 어분으로 대별하고,어분에fish soluble을 첨가해서 만든 것을whole meal(full meal)이라고 하며,불가식부를 원료로써 만든 어분을scrap meal이라고 한다.'],
	    ['어업','어업생산동향조사','조사용어','어업권<br>fishing right<br>漁業權','행정관청의 어업면허에 의하여 일정한 수면에서 배타적으로 일정한 어업을 할 수 있는 권리를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','어장<br>fishing ground<br>漁場','어떤 종류의 수산동식물이 많이 정착서식(定着棲息)하거나,무리를 지어 체류(滯留)또는 통과할 때,그것을 대상으로 어업이 일정 기간 동안 계속적으로 이루어지는 수역을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','어초(물고기집)<br>fish reef<br>漁礁','암초나 퇴(堆언덕)와 같이 해저 지형이 융기한 곳에서는 상승류가 일어나 영양염류를 표층에 운반하기 때문에 각종 부유생물과 치어가 번식해서 좋은 어장을 형성하는데 이와 같은 곳을 어초라 한다.'],
	    ['어업','어업생산동향조사','조사용어','어항<br>fishing port<br>漁港','천연 또는 인공의 어항시설을 갖춘 수산업근거지로서 어촌 어항법 제17조의 규정에 따라 지정 고시된 것'],
	    ['어업','어업생산동향조사','조사용어','어황<br>fishing condition<br>漁況','어기와 어장에 따른 어획의 상황을 가리키는 말이다.'],
	    ['어업','어업생산동향조사','조사용어','어황예보<br>forecastion of fishing condition<br>漁況豫報','연안정선 관측과 어항 정보에 의한 어장조사 자료를 종합해서 장래의 어황을 예측하여 어업자에게 통보하는 것을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','예인선(예선,끌배)<br>tugboat, towboat<br>曳引船','자체 항행력이 없는 부선이나 항행력은 있어도 일시 사용치 못하는 선박을 지정된 장소까지 끌어당기거나 밀어서 이동시키는 선박으로 규모는 작아도 강력한 추진력(高馬力)을 갖고 있음.안전 및 시설보호를 위하여 선박이 부두에 이·접안 하거나 갑문 통과시 예선을 사용토록 규제하고 있다.'],
	    ['어업','어업생산동향조사','조사용어','염분<br>salinity<br>鹽分','해수 중에 함유되어 있는 염류의 농도이다. 1902년 국제해양학총회는 염분을 해수1kg에 녹아 있는 물질의 총량으로 정의하며,단위는‰혹은ppt를 사용한다.이 때 해수 중의 모든 탄산염은 산화염으로 바꾸고 브롬과 요오드는 염소에 의해서 치환시키며,유기물질은480℃까지 산화시킨 다음 해수의 용해된 성분으로 계산에 포함시킨다.그런데,염분을 실제로 측정하는 것은 어려우므로 염분–염소량 관계식인S‰= 1.80655 C1‰에 의하여 염소량(C1)을 측정하여 염분을 구한다.최근에는 염분측정을 전기전도도가 염분에 비례하는 원리를 이용한 염분계(salinometer)에 의하여 측정한다.'],
	    ['어업','어업생산동향조사','조사용어','유수식양식<br>raceway culture system<br>流水式養殖','양식장 시설을 다량의 물이 항상 흐르도록 설계,운영되는 양식장 형태를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','자건품<br>boiled and dried products<br>煮乾品','어패류를 그대로 또는 염장한 것을 삶은 후 건조한 제품으로 마른멸치,마른 전복,마른해삼 등이 있다.'],
	    ['어업','어업생산동향조사','조사용어','자원량<br>資源量','어떤 어업의 어획대상이 되는 개체의 총량을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','자어<br>larva<br>仔魚','어류의 발육 단계에서 난 단계를 지나서 치어가 되기까지의 성장단계를 말한다.자어기부터 영양은 외계의 먹이로부터 섭취하며,겉모습이나 내부구조는 성어의 특징을 닮지 않는다.'],
	    ['어업','어업생산동향조사','조사용어','저서성어류<br>benthic fish<br>底棲性魚類','수심200m보다 깊은 곳에 사는 심해어류(deepsea fish)이면서 심해의 저층에 서식하는 어류를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','조방적양식<br>extensive culture<br>粗放的養殖','영세양식업자들이 생계수단으로 연못 등에서 저밀도로 사육하는 양식방법,조방적 양식이란 양식업자에 의해 제한된 범위 안의 넓은 수면적에 낮은 밀도의 양식생물을 유지,관리하는 양식방법을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','적수온<br>optimum temperature<br>適水溫','수산생물은 특정한 수온의 해역에서 생활한다.이 온도 범위를 적수온이라 한다.따라서 개개의 어류는 고유의 적수온을 가지게 되는데,한랭어족에서 고온성 어족까지 적수온별로 나열시키면 마치 스펙트럼과 같이 된다.이것을 적수온 스펙트럼(optimum temperature spectra diagram)이라 한다.'],
	    ['어업','어업생산동향조사','조사용어','조간대<br>intertidal zone<br>潮間帶','해안이 바다 쪽으로 확장되어 나간 해수와 육지의 경계부분으로 해안에서 밀물 시 해수가 가장 높게 들어온 부분과 썰물시 가장 낮게 나간 부분의 사이에 해당되는 곳으로 여기는 온도,염분,파랑 등과 같은 환경변화가 아주 심한 곳으로서,패류를 비롯해서 여러 가지 생물이 풍부하다.'],
	    ['어업','어업생산동향조사','조사용어','조석<br>tide<br>潮汐','밀물과 썰물의 수직 운동과 이것으로 일어나는 해수의 수평이동을 합치는 것을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','집약적양식<br>intensive culture<br>集約的養殖','양식 업자에 의해 큰 단위로 관리되는 고밀도로 양식생물을 사육하는 양식 방법,사육수조, raceway, silos,가두리(cage)등을 이용하여 집약적 양식이 이루어진다.'],
	    ['어업','어업생산동향조사','조사용어','총허용어획량(TAC)<br>total allowable catch<br>總許容漁獲量','어업자원의 지속적 이용을 목적으로 어획량을 정하여 관리하는 제도로서 어업자원의 지속적 이용을 위한 제도적 관리 장치로 보아야 하고,국가간 공동이용자원의 합리적 관리 수단의 필요성에 의한UN해양법 협약의무 이행사항이다.우리나라에서는1991년부터 제주도에서 소라에 대한 자체TAC를 이미 실시한 바 있고,근년에 들어서는 고등어 등 어류와 게류,패류 등으로 점차 확산되고 있다.'],
	    ['어업','어업생산동향조사','조사용어','치어<br>fry, fingerling<br>稚魚','물고기의 어린새끼로 형태와 생태가 어미와 흡사하다.후기 자어기 이후부터 성어기(반문과 색체에 나타나는 특징을 지닌 시기)이전까지의 어린 어류를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','친어<br>brood fish<br>親魚','완전히 성적으로 성숙하여 번식이 가능한 암컷과 수컷의 어미고기를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','패각<br>shell<br>貝殼','연체동물에서 연체를 싸서 보호하는 무기질의 분비형성물.이매패에서는 좌우2장,복족류에서는 나선형관 모양의 것1개,굴 족류에서는 위 끝에 개구(開口)가 있는 뿔 피리모양.무기염류95%와 단백질성의 콘키오린으로 구성,가장 바깥 부분은 얇은 각 피층으로 덮여 있고 다음에 각질층이 있으며 가장 안쪽부분,즉 외투의 진주층으로 형성되어 있다.'],
	    ['어업','어업생산동향조사','조사용어','해류<br>ocean current<br>海流','방향과 속도가 정상적인 해수의 유동을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','학명<br>scientic name<br>學名','생물의 군이 결정될 때,그것을 나타내기 위하여 부여되는 이름으로,국제적인 명명규약에 의해 그 선택 및 형식이 규정되어 있다.세계 공통어이며 린네의2명법에 사용되고 있다.'],
	    ['어업','어업생산동향조사','조사용어','한류<br>cold current<br>寒流','근원을 한대나 아한대에 두고 있으면서 주위보다 저온 저염분인 해수를 운반하는 해류이다.북태평양의 캘리포니아해류와 쿠릴해류,남태평양의 페루해류가 대표적이다.한류는 주위의 물보다도 녹색을 띠며 투명도가 낮고 저온으로,염분이 적으나 영양염이 풍부하다.식물성플랑크톤이 많아 냉수어의 좋은 어장이 된다.'],
	    ['어업','어업생산동향조사','조사용어','해수<br>sea water<br>海水','염도가30‰이상인 바닷물을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','해양<br>Ocean<br>海洋','5대양으로 구분,대서양(Atlantic Ocean),태평양(Pacific Ocean),인도양(Indian Ocean),남극해(Southern Ocean),북극해(Arctic Ocean)＊좀 더 작은 규모로는 지중해(Mediterranean Sea),카리브해(Caribbean Sea),동해(East Sea),베링해(Bering Sea)등이 있음'],
	    ['어업','어업생산동향조사','조사용어','해외어업<br>over seas fishery<br>海外漁業','어업의 분류 방법으로 해외 어업과 일반 해면어업으로 구분하여,해외 어업에는원양 참치연승 어업,원양 트롤어업,공선어업,기타 해외 어장에서 동력선으로 조업하는 상기 어느 것에도 분류되지 않는 어업 등이 있고,일반 해면어업에는 저인망어업,선망어업,부망어업,자망어업,인망어업,조연승어업,정치망어업,포패채조어업(捕貝採藻漁業),기타 어업 등이 있다.'],
	    ['어업','어업생산동향조사','조사용어','해황<br>oceanic conditions<br>海況','수온,염분의 분포,해류의 상태,수괴의 분포,수색,투명도의 양상,산소 등의 화학성분의 분포,미생물의 양상 등을 종합하여 해양의 상태를 말한다.'],
	    ['어업','어업생산동향조사','조사용어','협염성<br>stenohaline<br>狹鹽性','염분변화에 대한 적응범위가 좁은 것을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','활어선<br>live fish carrier<br>活魚船','활어를 운반하는 어선을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','유어(游漁)장','“유어장”이란 체험학습이나 낚시 등 관광용 어장을 말한다.'],
	    ['어업','어업생산동향조사','조사용어','가이식','초기 채묘한 종묘를 본 양성을 하기 전에 적응 및 건강 단련을 위하여 키우는 과정을 가이식이라 한다.'],
	    ['어업','어업생산동향조사','조사용어','개체군<br>個體群','서로 교배하여 자손을 생산할 수 있는,즉 유전자의 교환이 가능한 개체의 집합으로서 동일한 장소에 서식하는 개체들을 총칭'],
	    ['어업','어업생산동향조사','조사용어','고밀도양식<br>高密度養殖','일정한 수면이나 수량 속에서 사육하는 수족의 양을 증가시켜 기르는 것.보리새우,잉어 및 뱀장어 등의 유수식 양식은 이 예지만,일반적으로 양을 증가시키는데 따라 환경조건이 나빠지기 때문에 관리를 잘못하면 전멸하는 수가 있으므로 주의가 필요함'],
	    ['어업','어업생산동향조사','조사용어','그물가두리<br>Net cage','섬유망이나 철망과 기타재료로 만든 물고기의 수용기.수면에 띄우거나 중층에 매달거나 바닥에 침하(沈下)시켜 물고기를 양식할 때 사용'],
	    ['어업','어업생산동향조사','조사용어','기수어업<br>汽水漁業','일반적으로 하구역을 말하며,하구 부근을 하천의 흐름과 해양의 영향,특히 조석 작용의 영향을 많이 받아 염분,수위 및 유속 등이 현저하게 주기적으로 변하는 곳으로서 이와 같은 하구역은 영양염이 풍부하여 양식 사업이 번성<br>※담수,기수,해수의 구분'],
	    ['어업','어업생산동향조사','조사용어','내파성가두리<br>Protection of Destruction waves-aquafarm<br>耐波性','가두리의 양식시설을 고강도 폴리스틸렌(PE)파이프로 제작하여 태풍,폭풍의 내습시 높은 파도와 강한 바람에도 양식시설이 능히 견딜 수 있는 강도와 유연성을 겸비한 첨단 가두리시설로 사각형,육각형,팔각형 등이 있음'],
	    ['어업','어업생산동향조사','조사용어','냉수대<br>冷水帶','주변 수온보다5℃이상 낮은 수온을 나타내는 해역을 냉수대라 하며,일반적으로 우리나라 동해 남부 연안에서7～8월 경 출현,이는 저층냉수어수가 연안해역에서 표층으로 올라오는 용승작용으로 형성됨'],
	    ['어업','어업생산동향조사','조사용어','냉수어<br>冷水魚','온수어에 반대되는 말로서 일반적으로15℃이하의 수온이 적합한 어류로 연어·송어류 등이고,해산어로는 다랑어류와 청어 등임'],
	    ['어업','어업생산동향조사','조사용어','논양어<br>Paddy culture<br>논養魚','논에서 농사와 함께 물고기를 기르는 것으로 틸라피아(tilapia),잉어 및 붕어 등이 대표적임'],
	    ['어업','어업생산동향조사','조사용어','라니냐<br>La Nina','적도 해상 바닷물의 온도가0.5℃이상 비정상적으로 낮아지는 현상,적도부근의 편동풍이 강해져 온난한 수역이 서쪽으로 이동하면서 심해의 찬물이 상승하여 일어남.이러한 현상을 스페인어로 여자아이라는 의미인 라니냐라 부름↔엘니뇨'],
	    ['어업','어업생산동향조사','조사용어','면허어업<br>免許漁業','연안어장의 어업질서의 유지와 어업의 안정적 경영을 보장하기 위하여 특정인에게 면허를 부여하여 피면허자로 하여금 일정어장에서 특정어업을 독점적으로 행할 수 있게 할 필요가 있으며 이를 위하여 창설한 제도가 어업면허 제도이고,이 제도에 의하여 면허를 받아야 하는 어업을 면허어업이라 함<br> <면허어업의 종류><br>·정치망어업:어류의 이동 통로에 그물을 부설하여 어류를 포획하는 어업<br>·해조류 양식업:김,미역,다시마 등<br>·패류 양식업:굴,전복,바지락 등<br>·어류 등의 양식업:가두리 또는 축제식 어류양식,우렁쉥이,새우 등<br>·복합 양식업:어장을 가장 효율적으로 이용하기 위해 서로 다른2종 이상의 양식품종을 복합하여 양식하는 어업(미역+가리비,다시마+전복 등)<br>·협동 양식업:일정한 수심범위 이내의 수면을 구획하여 양식하는 것으로 어촌계,영어조합법인 또는 지구별 수협에 면허<br>·마을어업:일정한 지역 안에 거주하는 어업인의 공동이익 증진을 위해 어촌계,지구별 수협에게만 면허,패류,해조류 등 정착성수산동식물을 포획․채취<br>·외해양식업:수심35m이상의 수역에서 수산동식물을 양식하는 어업(참다랑어 등)'],

	    ['어업','어업생산동향조사','조사용어','신고어업<br>申告漁業','영세 어업인이 면허나 허가와 같은 까다로운 절차를 밟지 않고도 소규모 어업을 할 수 있도록 하는 제도로써 면허어업,허가어업 이외의 어업,주소지 또는 조업 장소 안에서 연간60일 이상 조업을 해야 하며,어업 행위가 제한되거나 금지된 수면에서는 조업금지<br><신고어업의 종류><br>·맨손어업:낫·호미·해조틀이 및 갈고리류 등을 이용하여 수산동식물을 포획·채취하는 어업<br>·나잠어업:산소공급 장치 없이 잠수한 후 낫,호미,칼 등을 사용하여 패류,해조류 그 밖의 정착성 수산동식물을 포획․채취하는 어업<br>·내수면어업법에 의한 면허 또는 허가어업 이외의 어업'],

	    ['어업','어업생산동향조사','조사용어','보합제<br>Share system<br>步合制','어업 임금 지불의 한 형태.어업노동에 대한 임금의 주요한 산정 방법은 크게 두 가지로 나눌 수 있는데,첫째는 노동을 제공한 경영의 수익에 대한 일정한 분배분(分配分)이고,둘째는 경영수익의 다과와 관계없이 제공 노동에 대한 직접적 대가로서의 일정한 고정 금액,전자가 보합제,후자가 고정급제의 임금임'],
	    ['어업','어업생산동향조사','조사용어','산란회유<br>Spawning migration<br>産卵徊遊','유영동물(遊泳動物)은 각각 산란조건이 갖추어진 수역(水域)으로 이동해서 산란하는 경우가 많으며 이 산란 때문에 이동하는 것을 산란 회유라고 함.산란장은 많은 종류가 연안이거나 내만의 얕은 곳 또는 조장(藻場)이지만,외양성(外洋性)으로 집단 생활을 하는 것을 외해(外海)에서 산란함'],

	    ['어업','어업생산동향조사','조사용어','수산업법 제9조(마을어업 등의 면허)','①마을어업은 일정한 지역에 거주하는 어업인의 공동이익을 증진하기 위하여 어촌계(漁村契)나 지구별수산업협동조합(이하“지구별수협”이라 한다.)에만 면허 한다.<br>②협동양식업은 일정한 지역에 거주하는 어업인의 공동이익과 어업의 생산성 향상을 위하여 어촌계,「농어업경영체 육성 및 지원에 관한 법률」제16조에 따른 영어조합법인(營漁組合法人)(이하“영어조합법인”이라 한다)또는 지구별수협에만 면허한다.<br>③면허를 받으러는 수면이 다음 각 호의 어느 하나에 해당하는 경우 그 수면에 대하여 행하는 해조류양식업과 바닥을 이용하는 패류양식업 및 어류양식업은 그 수면에서 가까운 어촌계,영어조합법인 또는 지구별수협에만 면허한다.<br> 1.마을어업의 어장에 있는 경우<br> 2.만조 때 해안선에서500미터(서행안은1천미터)이내의 수면으로서 제88조에 따른 해당 시군구수산조정위원회(특별자치도의 경우에는 시도수산조정위원회를 말한다)가 어업조정(漁業調整)을 위하여 필요하다고 인정하는 경우<br>④시장,군수,구청장은 어업인의 공동이익과 일정한 지역의 어업개발을 위하여 필요하다고 인정하면 어촌계,영어조합법인 또는 지구별수협에 마을어업,협동 양식업 및 왜해양식업 외의 어업을 면허할 수 있다.'],

// 필터를 설정합니다.
const selectedFilters = ['용어목록'];  // 필터 예시
const selectedSubCategories = []; // 서브 카테고리 예시 (비어있음)
const selectedCard = 'all';  // 카드 선택 예시 (전체 선택)

// 검색 기능 수정
document.getElementById("searchForm").addEventListener("submit", function(event) {
    event.preventDefault();
    const searchTerm = document.getElementById("searchTerm").value.toLowerCase();

    let hasResult = false;

    const tablesDiv = document.getElementById("tables");
    tablesDiv.innerHTML = '';  // 검색 결과를 초기화합니다.

    selectedFilters.forEach(category => {
        if (data.hasOwnProperty(category)) {
            const matchedData = data[category].filter(item => {
                return (
                    (selectedSubCategories.length === 0 || selectedSubCategories.includes('all') || selectedSubCategories.includes(item[0])) &&
                    (selectedCard === 'all' || item[1] === selectedCard) &&
                    (searchTerm === '' || item.join().toLowerCase().includes(searchTerm))
                );
            });

            if (matchedData.length > 0) {
                hasResult = true;

                const h2 = document.createElement('h2');
                h2.textContent = category;
                tablesDiv.appendChild(h2);

                const table = document.createElement('table');
                table.innerHTML = `<thead>
                    <tr>
                        <th>번호</th>
                        <th>구분</th>
                        <th>관련조사</th>
                        <th>용어구분</th>
                        <th>용어</th>
                        <th>해설</th>
                    </tr>
                </thead>
                <tbody id="resultBody_${category}"></tbody>`;

                tablesDiv.appendChild(table);

                const resultBody = document.getElementById(`resultBody_${category}`);

                matchedData.forEach((item, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${index + 1}</td>
                        <td>${item[0] || ''}</td>
                        <td>${item[1] || ''}</td>
                        <td>${item[2] || ''}</td>
                        <td>${item[3] || ''}</td>
                        <td>${item[4] || ''}</td>
                    `;
                    resultBody.appendChild(row);
                });
            }
        }
    });

    if (!hasResult) {
        alert('검색 결과가 없습니다.');
    }
});

// 초기화 버튼 클릭 시 필터 및 검색어 초기화
document.querySelector('h1').addEventListener('click', function() {
    document.getElementById("searchTerm").value = '';
    document.getElementById("tables").innerHTML = '';
});
